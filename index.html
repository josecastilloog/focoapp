<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foco">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Foco</title>
<style>
  :root{
    --bg:#17161A;
    --surface:#201E22;
    --surface-2:#2B282C;
    --line:#3B373B;
    --text:#ECE8E9;
    --muted:#A19A9C;
    --mint:#8C3A4A;
    --mint-dim:#4A2129;
    --amber:#B8586A;
    --danger:#C0525F;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:84px;
  }
  header.top{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--mint);
    font-weight:600;
    margin:0 0 6px;
  }
  h1{
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
    font-weight:700;
  }
  .subdate{
    color:var(--muted);
    font-size:13.5px;
    margin:0;
  }

  main{ flex:1; padding:18px 16px 8px; max-width:560px; width:100%; margin:0 auto; }

  .summary-row{
    display:flex; gap:10px; margin-bottom:20px;
  }
  .summary-card{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .summary-num{ font-size:24px; font-weight:700; line-height:1; }
  .summary-label{ font-size:11.5px; color:var(--muted); margin-top:6px; letter-spacing:0.02em; }

  .habit-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    transition:border-color .15s ease;
  }
  .habit-top{
    display:flex; align-items:center; gap:12px;
  }
  .habit-emoji{
    width:42px;height:42px;border-radius:12px;
    background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    font-size:20px; flex-shrink:0;
  }
  .habit-info{ flex:1; min-width:0; }
  .habit-name{ font-size:15.5px; font-weight:600; margin:0 0 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .habit-streak{ font-size:12.5px; color:var(--amber); display:flex; align-items:center; gap:4px; }
  .check-btn{
    width:44px;height:44px;border-radius:50%;
    border:2px solid var(--line);
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    cursor:pointer;
    flex-shrink:0;
    transition:all .15s ease;
    color:var(--muted);
  }
  .check-btn.done{
    background:var(--mint);
    border-color:var(--mint);
    color:#F3E7E9;
  }
  .chain{
    display:flex; gap:6px; margin-top:14px;
  }
  .chain-day{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .chain-dot{
    width:100%;
    aspect-ratio:1;
    border-radius:8px;
    background:var(--surface-2);
    border:1px solid var(--line);
    cursor:pointer;
    transition:transform .1s ease;
  }
  .chain-dot:active{ transform:scale(0.88); }
  .chain-dot.filled{
    background:var(--mint-dim);
    border-color:var(--mint);
    position:relative;
  }
  .chain-dot.filled.today{
    background:var(--mint);
  }
  .chain-label{
    font-size:9.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .habit-actions{
    display:flex; justify-content:flex-end; margin-top:10px;
  }
  .del-link{
    font-size:11.5px;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    padding:4px 6px;
  }
  .del-link:active{ color:var(--danger); }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .empty-emoji{ font-size:36px; margin-bottom:10px; }
  .empty p{ font-size:14px; line-height:1.5; margin:0; }

  .fab{
    position:fixed;
    bottom:92px; right:20px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--mint);
    color:#F3E7E9;
    border:none;
    font-size:28px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(140,58,74,0.4);
    cursor:pointer;
    z-index:20;
  }

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .tab{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 0;
    background:none; border:none;
    color:var(--muted);
    font-size:10.5px;
    font-family:inherit;
  }
  .tab .tab-icon{ font-size:18px; }
  .tab.active{ color:var(--mint); }
  .tab.disabled{ opacity:0.45; }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    display:flex; align-items:flex-end;
    z-index:30;
  }
  .modal{
    background:var(--surface);
    width:100%;
    border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .modal h2{ font-size:17px; margin:0 0 16px; }
  .field-label{ font-size:12px; color:var(--muted); margin-bottom:6px; display:block; }
  .emoji-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .emoji-opt{
    width:40px;height:40px;border-radius:10px;
    background:var(--surface-2); border:2px solid transparent;
    font-size:18px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .emoji-opt.selected{ border-color:var(--mint); }
  input.name-input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-size:15px;
    margin-bottom:18px;
    font-family:inherit;
  }
  input.name-input:focus{ outline:2px solid var(--mint); border-color:transparent; }
  .modal-actions{ display:flex; gap:10px; }
  .btn{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:none;
    font-size:14.5px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
  }
  .btn-primary{ background:var(--mint); color:#F3E7E9; }
  .btn-secondary{ background:var(--surface-2); color:var(--text); }
  .btn:disabled{ opacity:0.4; }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background:var(--surface-2);
    border:1px solid var(--line);
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    z-index:40;
  }

  .placeholder-view{
    text-align:center; padding:80px 24px; color:var(--muted);
  }
  .placeholder-view .big{ font-size:34px; margin-bottom:12px; }
  .placeholder-view h2{ color:var(--text); font-size:17px; margin:0 0 6px; }
  .placeholder-view p{ font-size:13.5px; line-height:1.5; margin:0; }

  .segmented{ display:flex; gap:6px; margin-bottom:18px; }
  .seg-btn{
    flex:1; padding:9px 0; text-align:center;
    border-radius:10px; background:var(--surface-2);
    border:1px solid var(--line); color:var(--muted);
    font-size:12.5px; font-weight:600; font-family:inherit; cursor:pointer;
  }
  .seg-btn.active{ background:var(--mint); color:#F3E7E9; border-color:var(--mint); }

  select.name-input{ appearance:none; -webkit-appearance:none; cursor:pointer; }
  input[type=date].name-input, input[type=time].name-input{ color-scheme:dark; }

  .empty-small{ text-align:center; padding:44px 20px; color:var(--muted); font-size:13.5px; line-height:1.5; }
  .empty-small .btn{ margin-top:14px; max-width:180px; margin-left:auto; margin-right:auto; }

  .color-row{ display:flex; gap:8px; margin-bottom:18px; }
  .color-opt{
    width:32px;height:32px;border-radius:50%;
    border:2px solid transparent; cursor:pointer;
  }
  .color-opt.selected{ border-color:var(--text); }

  .ramo-card{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
  }
  .ramo-dot{ width:14px; height:14px; border-radius:50%; flex-shrink:0; }
  .ramo-info{ flex:1; min-width:0; }
  .ramo-name{ font-size:14.5px; font-weight:600; margin:0 0 2px; }
  .ramo-meta{ font-size:12px; color:var(--muted); margin:0; }

  .day-picker{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; }
  .day-chip{
    flex:0 0 auto; padding:8px 13px; border-radius:10px;
    background:var(--surface-2); border:1px solid var(--line);
    color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .day-chip.active{ background:var(--mint); color:#F3E7E9; border-color:var(--mint); }

  .block-card{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--mint);
    border-radius:var(--radius); padding:12px 16px; margin-bottom:10px;
  }
  .block-time{ font-size:11.5px; color:var(--muted); font-weight:600; width:60px; flex-shrink:0; line-height:1.3; }
  .block-info{ flex:1; min-width:0; }
  .block-name{ font-size:14px; font-weight:600; margin:0 0 2px; }
  .block-room{ font-size:11.5px; color:var(--muted); margin:0; }

  .tarea-card{
    display:flex; align-items:flex-start; gap:12px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
  }
  .tarea-check{
    width:22px;height:22px;border-radius:6px;border:2px solid var(--line);
    flex-shrink:0; margin-top:1px; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent;
  }
  .tarea-check.done{ background:var(--mint); border-color:var(--mint); color:#F3E7E9; }
  .tarea-info{ flex:1; min-width:0; }
  .tarea-title{ font-size:14.5px; font-weight:600; margin:0 0 6px; }
  .tarea-title.done{ text-decoration:line-through; color:var(--muted); }
  .tarea-meta{ display:flex; gap:7px; align-items:center; flex-wrap:wrap; font-size:11.5px; color:var(--muted); }
  .tarea-ramo-tag{ padding:2px 8px; border-radius:6px; font-size:10.5px; font-weight:600; color:#F3E7E9; }
  .tarea-date{ font-weight:600; }
  .tarea-date.overdue{ color:var(--danger); }
  .prio-badge{ padding:2px 8px; border-radius:6px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; }
  .prio-alta{ background:var(--mint); color:#F3E7E9; }
  .prio-media{ background:transparent; border:1px solid var(--amber); color:var(--amber); }
  .prio-baja{ background:var(--surface-2); color:var(--muted); }
  .section-label{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; font-weight:600; margin:20px 0 10px; }

  .cat-filter{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px; }
  .cat-chip{
    flex:0 0 auto; padding:7px 13px; border-radius:20px;
    background:var(--surface-2); border:1px solid var(--line);
    color:var(--muted); font-size:12.5px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .cat-chip.active{ background:var(--mint); color:#F3E7E9; border-color:var(--mint); }
  .cat-chip .cat-dot{ width:8px; height:8px; border-radius:50%; }

  .note-card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    border-left:4px solid var(--line);
    cursor:pointer;
  }
  .note-top-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .note-title{ font-size:14.5px; font-weight:600; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .note-date{ font-size:11px; color:var(--muted); flex-shrink:0; }
  .note-preview{ font-size:12.5px; color:var(--muted); margin:0 0 8px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .note-cat-tag{ font-size:10.5px; padding:2px 8px; border-radius:6px; font-weight:600; color:#F3E7E9; display:inline-block; }

  textarea.name-input{
    resize:vertical; min-height:160px; font-family:inherit; line-height:1.5;
  }
  .note-detail-actions{ display:flex; gap:10px; margin-top:12px; }
  .cat-manage-list{ margin-bottom:16px; }
  .cat-manage-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; background:var(--surface-2);
    border-radius:10px; margin-bottom:6px;
  }
  .cat-manage-row .cat-dot{ width:12px; height:12px; border-radius:50%; }
  .cat-manage-row .name{ flex:1; font-size:13.5px; }
  .cat-manage-row .del-link{ font-size:11px; }
  .cat-add-row{ display:flex; gap:8px; margin-bottom:16px; }
  .cat-add-row input{ flex:1; margin-bottom:0; }
  .cat-add-row .add-btn{
    padding:0 16px; background:var(--mint); color:#F3E7E9;
    border:none; border-radius:10px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .manage-link{
    background:none; border:none; color:var(--mint);
    font-size:12px; font-family:inherit; cursor:pointer;
    margin-left:auto; padding:0;
  }

  .notif-banner{
    background:var(--surface-2); border:1px solid var(--line);
    border-left:3px solid var(--amber);
    border-radius:10px; padding:12px 14px; margin-bottom:14px;
    font-size:12.5px; color:var(--text); line-height:1.4;
  }
  .notif-banner p{ margin:0 0 10px; }
  .notif-banner .btn{ font-size:12.5px; padding:8px 14px; }

  .rec-card{
    display:flex; align-items:flex-start; gap:12px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    border-left:4px solid var(--mint);
  }
  .rec-time-block{
    flex-shrink:0; text-align:center; min-width:56px;
    padding-right:12px; border-right:1px solid var(--line);
  }
  .rec-time{ font-size:16px; font-weight:700; margin:0; line-height:1; }
  .rec-date{ font-size:10.5px; color:var(--muted); margin:4px 0 0; text-transform:uppercase; letter-spacing:0.04em; }
  .rec-info{ flex:1; min-width:0; }
  .rec-title{ font-size:14.5px; font-weight:600; margin:0 0 4px; }
  .rec-title.pasado{ color:var(--muted); text-decoration:line-through; }
  .rec-meta{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:11px; color:var(--muted); }
  .rec-repeat-badge{
    padding:2px 8px; border-radius:6px; font-size:10px; font-weight:600;
    background:var(--surface-2); color:var(--muted);
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .rec-vencido{ color:var(--danger); font-weight:600; }
  .rec-actions{ display:flex; flex-direction:column; gap:4px; align-items:flex-end; flex-shrink:0; }
  .icon-btn{
    background:none; border:none; color:var(--muted);
    font-size:16px; cursor:pointer; padding:4px 6px; font-family:inherit;
  }
  .icon-btn:active{ color:var(--text); }

  /* --- Entrenos --- */
  .rutina-card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
  }
  .rutina-top{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .rutina-name{ font-size:15px; font-weight:600; margin:0; flex:1; }
  .rutina-summary{ font-size:12px; color:var(--muted); margin:0 0 12px; }
  .rutina-exlist{ font-size:12.5px; color:var(--muted); line-height:1.6; margin:0 0 12px; }
  .rutina-exlist .ex-line{ display:block; }
  .rutina-actions{ display:flex; gap:8px; }
  .btn-sm{
    flex:1; padding:10px; border-radius:10px; border:none;
    font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;
  }
  .btn-start{ background:var(--mint); color:#F3E7E9; }
  .btn-outline{ background:transparent; border:1px solid var(--line); color:var(--text); }

  .active-header{
    background:var(--surface); border:1px solid var(--mint);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .active-header .info{ flex:1; min-width:0; }
  .active-title{ font-size:14.5px; font-weight:600; margin:0 0 3px; }
  .active-timer{ font-size:12.5px; color:var(--mint); font-weight:600; font-variant-numeric:tabular-nums; }
  .active-finish{ padding:9px 14px; border-radius:8px; border:none; background:var(--mint); color:#F3E7E9; font-weight:600; font-size:13px; font-family:inherit; cursor:pointer; }

  .exercise-block{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:12px;
  }
  .exercise-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .exercise-name{ font-size:14.5px; font-weight:600; margin:0; flex:1; }
  .exercise-tag{
    font-size:10px; padding:2px 7px; border-radius:6px;
    background:var(--surface-2); color:var(--muted);
    text-transform:uppercase; letter-spacing:0.03em; font-weight:600;
  }
  .sets-table{
    display:grid; grid-template-columns: 30px 1fr 1fr 40px 34px;
    gap:6px; align-items:center; font-size:12.5px;
  }
  .sets-header{
    font-size:10px; color:var(--muted); text-transform:uppercase;
    letter-spacing:0.05em; font-weight:600; padding:2px 0;
  }
  .set-row{
    display:contents;
  }
  .set-row-cell{ padding:6px 0; }
  .set-num{
    background:var(--surface-2); border-radius:6px; padding:5px 0;
    text-align:center; font-weight:600; font-size:12px;
  }
  .set-input{
    background:var(--surface-2); border:1px solid var(--line);
    color:var(--text); border-radius:6px; padding:7px 8px;
    font-size:13px; font-family:inherit; width:100%;
    text-align:center; font-variant-numeric:tabular-nums;
  }
  .set-input:focus{ outline:2px solid var(--mint); border-color:transparent; }
  .set-input.done{ background:rgba(140,58,74,0.12); border-color:var(--mint); }
  .set-check{
    width:32px; height:32px; border-radius:8px;
    background:var(--surface-2); border:1.5px solid var(--line);
    color:var(--muted); font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .set-check.done{ background:var(--mint); border-color:var(--mint); color:#F3E7E9; }
  .set-del{
    background:none; border:none; color:var(--muted); font-size:14px;
    cursor:pointer; padding:0; font-family:inherit;
  }
  .add-set-btn{
    width:100%; margin-top:8px; padding:8px; border-radius:8px;
    background:var(--surface-2); border:1px dashed var(--line);
    color:var(--muted); font-size:12px; font-family:inherit; cursor:pointer;
  }
  .prev-hint{
    font-size:11px; color:var(--muted); margin:0 0 8px;
    padding:6px 8px; background:var(--surface-2); border-radius:6px;
  }
  .add-ex-btn{
    width:100%; padding:12px; border-radius:10px;
    background:transparent; border:1.5px dashed var(--line);
    color:var(--muted); font-size:13px; font-family:inherit; cursor:pointer;
    margin-bottom:14px;
  }

  .hist-card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    border-left:4px solid var(--mint);
  }
  .hist-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px; }

}

// --- Sistema de notificaciones ---
function notifState(){
  if(!('Notification' in window)) return 'unsupported';
  return Notification.permission; // 'default' | 'granted' | 'denied'
}

async function requestNotifPermission(){
  if(!('Notification' in window)){
    showToast('Este navegador no soporta notificaciones');
    return;
  }
  const result = await Notification.requestPermission();
  if(result === 'granted'){
    showToast('Notificaciones activadas ✓');
    scheduleAllNotifications();
  } else if(result === 'denied'){
    showToast('Notificaciones bloqueadas');
  }
  renderTab();
}

function fireNotification(rec){
  if(notifState() !== 'granted') return;
  const opts = {
    body: 'Recordatorio programado',
    icon: 'icon-192.png',
    badge: 'icon-192.png',
    tag: 'rec_' + rec.id,
    requireInteraction: false
  };
  // Preferir service worker (funciona mejor cuando la pestaña no está enfocada)
  if(navigator.serviceWorker && navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({
      type: 'SHOW_NOTIFICATION',
      payload: { title: rec.titulo, body: opts.body, tag: opts.tag }
    });
  } else {
    try{ new Notification(rec.titulo, opts); }catch(e){}
  }
}

function nextOccurrenceMs(rec, fromMs){
  // Devuelve el próximo timestamp en ms desde fromMs (o null si ya no aplica)
  const baseMs = new Date(rec.fecha + 'T' + rec.hora).getTime();
  if(rec.repeticion === 'ninguna'){
    return baseMs > fromMs ? baseMs : null;
  }
  if(baseMs > fromMs) return baseMs;
  // Avanzar según repetición hasta pasar fromMs
  const d = new Date(baseMs);
  const step = () => {
    if(rec.repeticion === 'diaria') d.setDate(d.getDate() + 1);
    else if(rec.repeticion === 'semanal') d.setDate(d.getDate() + 7);
    else if(rec.repeticion === 'mensual') d.setMonth(d.getMonth() + 1);
  };
  let guard = 0;
  while(d.getTime() <= fromMs && guard < 10000){ step(); guard++; }
  return d.getTime();
}

function clearAllTimers(){
  Object.values(notifTimers).forEach(id => clearTimeout(id));
  notifTimers = {};
}

function scheduleNotificationFor(rec){
  if(notifTimers[rec.id]){ clearTimeout(notifTimers[rec.id]); delete notifTimers[rec.id]; }
  if(rec.completado && rec.repeticion === 'ninguna') return;
  if(notifState() !== 'granted') return;
  const now = Date.now();
  const next = nextOccurrenceMs(rec, now);
  if(next === null) return;
  const delay = next - now;
  // setTimeout se rompe con delays > ~24 días. Solo agendamos si es dentro de 24h.
  const MAX = 24 * 60 * 60 * 1000;
  if(delay > MAX) return;
  notifTimers[rec.id] = setTimeout(() => {
    fireNotification(rec);
    // Si tiene repetición, reagendamos automáticamente
    if(rec.repeticion !== 'ninguna'){
      scheduleNotificationFor(rec);
    } else {
      // Uso único: quedará marcado como pasado en la próxima renderización
    }
    if(currentTab === 'recordatorios') renderTab();
  }, delay);
}

function scheduleAllNotifications(){
  clearAllTimers();
  recs.items.forEach(scheduleNotificationFor);
}

// Reagendar cada hora (por si hay recordatorios que estaban a >24h y ahora entran en ventana)

function formatDuration(ms){
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if(h > 0) return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function calcVolumen(ejercicios){
  let total = 0;
  ejercicios.forEach(ej => {
    (ej.sets || []).forEach(s => {
      if(s.hecho && s.peso && s.reps){
        total += Number(s.peso) * Number(s.reps);
      }
    });
  });
  return total;
}

function lastPerformance(nombreEjercicio){
  // Busca la última vez que se hizo este ejercicio en el historial
  for(let i = entrenos.historial.length - 1; i >= 0; i--){
    const sesion = entrenos.historial[i];
    const ej = (sesion.ejercicios || []).find(e => e.nombre.toLowerCase() === nombreEjercicio.toLowerCase());
    if(ej){
      const doneSets = (ej.sets || []).filter(s => s.hecho && s.peso && s.reps);
      if(doneSets.length > 0){
        return { fecha: sesion.fecha, sets: doneSets };
      }
    }
  }
  return null;
}

function showToast(msg){

function computeStreak(habitId){
  const dates = state.completions[habitId] || {};
  let streak = 0;
  let cursor = new Date();
  // if today not done, streak counts back from yesterday but only "active" if today or yesterday done
  let dayOffset = 0;
  const today = todayISO();
  if(!dates[today]){
    dayOffset = 1; // start checking from yesterday
  }
  while(true){
    const iso = isoDaysAgo(dayOffset);
    if(dates[iso]){
      streak++;
      dayOffset++;
    } else {
      break;
    }
  }
  return streak;
}

function renderChain(habitId){
  const dates = state.completions[habitId] || {};
  const today = todayISO();
  let html = '';
  for(let i=6;i>=0;i--){
    const iso = isoDaysAgo(i);
    const d = new Date();
    d.setDate(d.getDate()-i);
    const letter = DAY_LETTERS[d.getDay()];
    const filled = !!dates[iso];
    const isToday = iso === today;
    html += '<div class="chain-day">'
          + '<div class="chain-dot'+(filled?' filled':'')+(isToday?' today':'')+'" data-date="'+iso+'" data-habit="'+habitId+'"></div>'
          + '<div class="chain-label">'+letter+'</div>'
          + '</div>';
  }
  return html;
}

function renderHabitsView(){
  const main = document.getElementById('mainView');
  if(state.habits.length === 0){
    main.innerHTML = '<div class="empty"><div class="empty-emoji">🌱</div>'
      + '<p>Todavía no tienes hábitos.<br>Toca el botón + para crear el primero.</p></div>';
    return;
  }

  const doneToday = state.habits.filter(h => (state.completions[h.id]||{})[todayISO()]).length;
  const totalHabits = state.habits.length;
  const bestStreak = Math.max(0, ...state.habits.map(h => computeStreak(h.id)));

  let html = '<div class="summary-row">'
    + '<div class="summary-card"><div class="summary-num">'+doneToday+'/'+totalHabits+'</div><div class="summary-label">Hoy completados</div></div>'
    + '<div class="summary-card"><div class="summary-num">'+bestStreak+'</div><div class="summary-label">Mejor racha</div></div>'
    + '</div>';

  state.habits.forEach(h => {
    const streak = computeStreak(h.id);
    const doneToday = !!(state.completions[h.id]||{})[todayISO()];
    html += '<div class="habit-card">'
      + '<div class="habit-top">'
      + '<div class="habit-emoji">'+h.emoji+'</div>'
      + '<div class="habit-info"><p class="habit-name">'+escapeHtml(h.name)+'</p>'
      + '<p class="habit-streak">'+(streak>0 ? '🔥 '+streak+' día'+(streak===1?'':'s')+' seguidos' : 'Sin racha activa')+'</p></div>'
      + '<button class="check-btn'+(doneToday?' done':'')+'" data-habit="'+h.id+'">'+(doneToday?'✓':'')+'</button>'
      + '</div>'
      + '<div class="chain">'+renderChain(h.id)+'</div>'
      + '<div class="habit-actions"><button class="del-link" data-del="'+h.id+'">Eliminar</button></div>'
      + '</div>';
  });

  main.innerHTML = html;

  main.querySelectorAll('.check-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-habit');
      const today = todayISO();
      if(!state.completions[id]) state.completions[id] = {};
      if(state.completions[id][today]){
        delete state.completions[id][today];
      } else {
        state.completions[id][today] = true;
      }
      renderHabitsView();
      debouncedSaveData();
    });
  });

  main.querySelectorAll('.chain-dot').forEach(dot => {
    dot.addEventListener('click', async () => {
      const id = dot.getAttribute('data-habit');
      const date = dot.getAttribute('data-date');
      if(!state.completions[id]) state.completions[id] = {};
      if(state.completions[id][date]){
        delete state.completions[id][date];
      } else {
        state.completions[id][date] = true;
      }
      renderHabitsView();
      debouncedSaveData();
    });
  });

  main.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-del');
      const habit = state.habits.find(h=>h.id===id);
      if(!habit) return;
      if(confirm('¿Eliminar "'+habit.name+'"? Se perderá su historial.')){
        state.habits = state.habits.filter(h => h.id !== id);
        delete state.completions[id];
        renderHabitsView();
        debouncedSaveData();
      }
    });
  });
}

  }

    html += '<div class="ramo-card">'

function buildHorarioHtml(){
  if(uni.ramos.length === 0){
    return '<div class="empty-small">Necesitas al menos un ramo para armar tu horario.'
      + '<br><button class="btn btn-primary" id="goToRamos">Agregar ramo</button></div>';
  }
  let html = '<div class="day-picker">';
  DAYS_ORDER.forEach(d => {
    html += '<button class="day-chip'+(uniDay===d?' active':'')+'" data-day="'+d+'">'+DAYS_LABEL[d]+'</button>';
  });
  html += '</div>';

  const blocks = uni.horario.filter(b => b.dia === uniDay)
    .sort((a,b) => a.horaInicio.localeCompare(b.horaInicio));

  if(blocks.length === 0){
    html += '<div class="empty-small">Sin clases este día. Toca + para agregar una.</div>';
    return html;
  }

  blocks.forEach(b => {
    const ramo = ramoById(b.ramoId);

function buildTareasHtml(){
  if(uni.tareas.length === 0){
    return '<div class="empty-small">Sin tareas pendientes.<br>Toca + para agregar una.</div>';
  }
  const today = todayISO();
  const pendientes = uni.tareas.filter(t => !t.completada).sort((a,b) => a.fecha.localeCompare(b.fecha));
  const completadas = uni.tareas.filter(t => t.completada).sort((a,b) => b.fecha.localeCompare(a.fecha));

  let html = '';
  if(pendientes.length === 0){
    html += '<div class="empty-small">No tienes tareas pendientes 🎉</div>';
  } else {
    pendientes.forEach(t => html += tareaCardHtml(t, today));
  }
  if(completadas.length > 0){
    html += '<p class="section-label">Completadas</p>';
    completadas.forEach(t => html += tareaCardHtml(t, today));
  }
  return html;
}

function tareaCardHtml(t, today){
  const ramo = t.ramoId ? ramoById(t.ramoId) : null;
  const overdue = !t.completada && t.fecha < today;
  const [y,m,d] = t.fecha.split('-');
  const fechaDisplay = d+'/'+m;
  const prioLabel = { alta:'Alta', media:'Media', baja:'Baja' }[t.prioridad] || 'Media';
  return '<div class="tarea-card">'
    + '<button class="tarea-check'+(t.completada?' done':'')+'" data-check-tarea="'+t.id+'">'+(t.completada?'✓':'')+'</button>'
    + '<div class="tarea-info">'
    + '<p class="tarea-title'+(t.completada?' done':'')+'">'+escapeHtml(t.titulo)+'</p>'
    + '<div class="tarea-meta">'
    + (ramo ? '<span class="tarea-ramo-tag" style="background:'+ramo.color+'">'+escapeHtml(ramo.sigla||ramo.nombre)+'</span>' : '<span class="tarea-ramo-tag" style="background:var(--surface-2);color:var(--muted)">General</span>')
    + '<span class="prio-badge prio-'+t.prioridad+'">'+prioLabel+'</span>'
    + '<span class="tarea-date'+(overdue?' overdue':'')+'">'+(overdue?'⚠ ':'')+fechaDisplay+'</span>'
    + '</div></div>'
    + '<button class="del-link" data-del-tarea="'+t.id+'">Eliminar</button>'
    + '</div>';
}

function formatShortDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  if(isToday){
    return d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
  }
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short' });
}

function renderRecordatoriosView(){
  const main = document.getElementById('mainView');
  let html = '';

  // Banner de permisos si no están concedidos
  const nState = notifState();
  if(nState === 'default'){
    html += '<div class="notif-banner">'
      + '<p>Para que Foco te avise a la hora del recordatorio, necesitamos permiso de notificaciones.</p>'
      + '<button class="btn btn-primary" id="askNotif">Activar notificaciones</button>'
      + '</div>';
  } else if(nState === 'denied'){
    html += '<div class="notif-banner">'
      + '<p>Las notificaciones están bloqueadas. Puedes activarlas desde los permisos del sitio en tu navegador.</p>'
      + '</div>';
  } else if(nState === 'unsupported'){
    html += '<div class="notif-banner">'
      + '<p>Tu navegador no soporta notificaciones. Los recordatorios funcionan como lista.</p>'
      + '</div>';
  }

  if(recs.items.length === 0){
    html += '<div class="empty-small">Sin recordatorios.<br>Toca + para crear el primero.</div>';
    main.innerHTML = html;
    attachRecListeners();
    return;
  }

  const now = Date.now();
  const enriched = recs.items.map(r => {
    const nextMs = nextOccurrenceMs(r, now - 60000); // ventana atrás de 1 min para "hace un momento"
    return { ...r, _nextMs: nextMs };
  });

  const proximos = enriched
    .filter(r => !r.completado && r._nextMs !== null)
    .sort((a,b) => a._nextMs - b._nextMs);

  const pasados = enriched
    .filter(r => r.completado || r._nextMs === null)
    .sort((a,b) => {
      const aMs = new Date(a.fecha+'T'+a.hora).getTime();
      const bMs = new Date(b.fecha+'T'+b.hora).getTime();
      return bMs - aMs;
    });

  if(proximos.length > 0){
    proximos.forEach(r => html += recCardHtml(r, now));
  } else {
    html += '<div class="empty-small">Sin recordatorios próximos 🎉</div>';
  }

  if(pasados.length > 0){
    html += '<p class="section-label">Pasados</p>';
    pasados.forEach(r => html += recCardHtml(r, now, true));
  }

  main.innerHTML = html;
  attachRecListeners();
}

function recCardHtml(r, now, esPasado){
  const nextMs = r._nextMs;
  const displayMs = nextMs !== null ? nextMs : new Date(r.fecha+'T'+r.hora).getTime();
  const d = new Date(displayMs);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const fechaDisplay = formatRelDate(d);
  const vencido = !esPasado && nextMs !== null && nextMs < now;
  const repLabel = { ninguna:'Única', diaria:'Diaria', semanal:'Semanal', mensual:'Mensual' }[r.repeticion] || 'Única';

  return '<div class="rec-card">'
    + '<div class="rec-time-block">'
    + '<p class="rec-time">'+hh+':'+mm+'</p>'
    + '<p class="rec-date">'+fechaDisplay+'</p>'
    + '</div>'
    + '<div class="rec-info">'
    + '<p class="rec-title'+(esPasado?' pasado':'')+'">'+escapeHtml(r.titulo)+'</p>'
    + '<div class="rec-meta">'
    + '<span class="rec-repeat-badge">'+repLabel+'</span>'
    + (vencido ? '<span class="rec-vencido">⚠ vencido</span>' : '')
    + '</div>'
    + '</div>'
    + '<div class="rec-actions">'
    + '<button class="icon-btn" data-edit-rec="'+r.id+'" title="Editar">✎</button>'
    + '<button class="icon-btn" data-toggle-rec="'+r.id+'" title="'+(r.completado?'Reactivar':'Marcar hecho')+'">'+(r.completado?'↺':'✓')+'</button>'
    + '<button class="icon-btn" data-del-rec="'+r.id+'" title="Eliminar">🗑</button>'
    + '</div>'
    + '</div>';
}

function formatRelDate(d){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.round((target - today) / 86400000);
  if(diffDays === 0) return 'Hoy';
  if(diffDays === 1) return 'Mañana';
  if(diffDays === -1) return 'Ayer';
  if(diffDays > 1 && diffDays < 7) return d.toLocaleDateString('es-ES', { weekday:'short' });
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short' });
}

function nowPlusMinutes(min){
  const d = new Date(Date.now() + min * 60000);
  const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const hora = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return { fecha: iso, hora };
}

    const fecha = document.getElementById('recFecha').value;
    const hora = document.getElementById('recHora').value;

      const id = 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);

  // Si hay entreno activo, forzar la vista "activa"
  if(entrenos.activa && entSub !== 'activa'){
    entSub = 'activa';
  }

  let html = '<div class="segmented">';
  html += segBtnEnt('rutinas', 'Rutinas');
  if(entrenos.activa){
    html += segBtnEnt('activa', 'En curso');
  }
  html += segBtnEnt('historial', 'Historial');
  html += '</div>';

  if(entSub === 'rutinas') html += buildRutinasHtml();
  else if(entSub === 'activa') html += buildActivaHtml();
  else html += buildHistorialHtml();

  main.innerHTML = html;
  attachEntrenosListeners();

  // Timer del entreno activo
  if(entSub === 'activa' && entrenos.activa){
    startActiveTimer();
  } else {
    stopActiveTimer();
  }
}

function segBtnEnt(key, label){
  return '<button class="seg-btn'+(entSub===key?' active':'')+'" data-ent-seg="'+key+'">'+label+'</button>';
}

function buildRutinasHtml(){
  if(entrenos.rutinas.length === 0){
    return '<div class="empty-small">Aún no tienes rutinas.<br>Toca + para crear tu primera plantilla de entrenamiento.</div>';
  }
  let html = '';
  entrenos.rutinas.forEach(r => {
    const numEj = (r.ejercicios || []).length;
    const totalSets = (r.ejercicios || []).reduce((s, e) => s + (e.setsObjetivo || 0), 0);
    const exList = (r.ejercicios || []).slice(0, 4).map(e =>
      '<span class="ex-line">• '+escapeHtml(e.nombre)+' <span style="color:var(--muted)">('+e.setsObjetivo+' × '+e.repsObjetivo+')</span></span>'
    ).join('');
    const more = numEj > 4 ? '<span class="ex-line" style="color:var(--muted)">+ '+(numEj-4)+' más</span>' : '';

    html += '<div class="rutina-card">'
      + '<div class="rutina-top"><p class="rutina-name">'+escapeHtml(r.nombre)+'</p></div>'
      + '<p class="rutina-summary">'+numEj+' ejercicio'+(numEj===1?'':'s')+' · '+totalSets+' sets objetivo</p>'
      + '<div class="rutina-exlist">'+exList+more+'</div>'
      + '<div class="rutina-actions">'
      + '<button class="btn-sm btn-outline" data-edit-rutina="'+r.id+'">Editar</button>'
      + (entrenos.activa ? '' : '<button class="btn-sm btn-start" data-start-rutina="'+r.id+'">Iniciar</button>')
      + '</div>'
      + '</div>';
  });
  return html;
}

function buildActivaHtml(){
  const a = entrenos.activa;
  if(!a) return '<div class="empty-small">No hay entrenamiento en curso.</div>';

  let html = '<div class="active-header">'
    + '<div class="info">'
    + '<p class="active-title">'+escapeHtml(a.nombre)+'</p>'
    + '<p class="active-timer" id="activeTimer">00:00</p>'
    + '</div>'
    + '<button class="active-finish" id="finishBtn">Terminar</button>'
    + '</div>';

  a.ejercicios.forEach((ej, exIdx) => {
    const prev = lastPerformance(ej.nombre);
    let prevHint = '';
    if(prev){
      const summary = prev.sets.map(s => s.peso+'kg × '+s.reps).slice(0, 4).join(' · ');
      prevHint = '<p class="prev-hint">Última vez: '+escapeHtml(summary)+'</p>';
    }

    html += '<div class="exercise-block">'
      + '<div class="exercise-head">'
      + '<p class="exercise-name">'+escapeHtml(ej.nombre)+'</p>'
      + (ej.grupo ? '<span class="exercise-tag">'+escapeHtml(ej.grupo)+'</span>' : '')
      + '<button class="icon-btn" data-del-ex-activa="'+exIdx+'">🗑</button>'
      + '</div>'
      + prevHint
      + '<div class="sets-table">'
      + '<div class="sets-header">Set</div>'
      + '<div class="sets-header">Peso (kg)</div>'
      + '<div class="sets-header">Reps</div>'
      + '<div class="sets-header"></div>'
      + '<div class="sets-header"></div>';

    (ej.sets || []).forEach((set, setIdx) => {
      const doneCls = set.hecho ? ' done' : '';
      html += '<div class="set-row-cell set-num">'+(setIdx+1)+'</div>'
        + '<div class="set-row-cell"><input class="set-input'+doneCls+'" type="number" inputmode="decimal" step="0.5" value="'+(set.peso||'')+'" data-set-input="peso" data-ex="'+exIdx+'" data-set="'+setIdx+'" placeholder="'+(set.pesoPlaceholder||'-')+'"></div>'
        + '<div class="set-row-cell"><input class="set-input'+doneCls+'" type="number" inputmode="numeric" value="'+(set.reps||'')+'" data-set-input="reps" data-ex="'+exIdx+'" data-set="'+setIdx+'" placeholder="'+(set.repsPlaceholder||'-')+'"></div>'
        + '<div class="set-row-cell"><button class="set-check'+doneCls+'" data-toggle-set="'+exIdx+'-'+setIdx+'">'+(set.hecho?'✓':'')+'</button></div>'
        + '<div class="set-row-cell"><button class="set-del" data-del-set="'+exIdx+'-'+setIdx+'">✕</button></div>';
    });

    html += '</div>'
      + '<button class="add-set-btn" data-add-set="'+exIdx+'">+ Agregar set</button>'
      + '</div>';
  });

  html += '<button class="add-ex-btn" id="addExActivaBtn">+ Agregar ejercicio</button>';
  return html;
}

function buildHistorialHtml(){
  if(entrenos.historial.length === 0){
    return '<div class="empty-small">Sin entrenamientos completados aún.</div>';
  }
  let html = '';
  const ordenados = [...entrenos.historial].sort((a,b) => b.fecha.localeCompare(a.fecha));
  ordenados.forEach(s => {
    const totalSets = (s.ejercicios || []).reduce((sum, e) => sum + (e.sets || []).filter(x => x.hecho).length, 0);
    const volumen = s.volumen || 0;
    const dur = s.duracionMs ? formatDuration(s.duracionMs) : '—';
    const exNames = (s.ejercicios || []).map(e => e.nombre).join(', ');
    const fechaObj = new Date(s.fecha);
    const fechaDisplay = fechaObj.toLocaleDateString('es-ES', { day:'numeric', month:'short' });

    html += '<div class="hist-card">'
      + '<div class="hist-top"><p class="hist-name">'+escapeHtml(s.nombre)+'</p><span class="hist-date">'+fechaDisplay+'</span></div>'
      + '<div class="hist-stats">'
      + '<div class="hist-stat"><span class="hist-stat-val">'+dur+'</span><span class="hist-stat-lbl">Duración</span></div>'
      + '<div class="hist-stat"><span class="hist-stat-val">'+totalSets+'</span><span class="hist-stat-lbl">Sets</span></div>'
      + '<div class="hist-stat"><span class="hist-stat-val">'+Math.round(volumen)+' kg</span><span class="hist-stat-lbl">Volumen</span></div>'
      + '</div>'
      + '<p class="hist-exlist">'+escapeHtml(exNames)+'</p>'
      + '<div class="rutina-actions" style="margin-top:10px">'
      + '<button class="btn-sm btn-outline" data-del-hist="'+s.id+'">Eliminar</button>'
      + '</div>'
      + '</div>';
  });
  return html;
}

function startActiveTimer(){
  stopActiveTimer();
  const update = () => {
    const el = document.getElementById('activeTimer');
    if(el && entrenos.activa){
      el.textContent = formatDuration(Date.now() - entrenos.activa.inicioMs);
    }
  };
  update();
  activeTimerInterval = setInterval(update, 1000);
}

function stopActiveTimer(){
  if(activeTimerInterval){ clearInterval(activeTimerInterval); activeTimerInterval = null; }
}

function attachEntrenosListeners(){
  const main = document.getElementById('mainView');

  main.querySelectorAll('[data-ent-seg]').forEach(btn => {
    btn.addEventListener('click', () => {
      entSub = btn.getAttribute('data-ent-seg');
      renderEntrenosView();
    });
  });

  // --- Rutinas ---
  main.querySelectorAll('[data-edit-rutina]').forEach(btn => {
    btn.addEventListener('click', () => openRutinaModal(btn.getAttribute('data-edit-rutina')));
  });
  main.querySelectorAll('[data-start-rutina]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-start-rutina');
      const rutina = rutinaById(id);
      if(!rutina) return;
      entrenos.activa = {
        rutinaId: id,
        nombre: rutina.nombre,
        inicioMs: Date.now(),
        ejercicios: (rutina.ejercicios || []).map(ej => ({
          nombre: ej.nombre,
          grupo: ej.grupo || '',
          sets: Array.from({length: ej.setsObjetivo || 3}, () => ({
            peso:'', reps:'', hecho:false,
            pesoPlaceholder:'', repsPlaceholder: ej.repsObjetivo || ''
          }))
        }))
      };
      entSub = 'activa';
      renderEntrenosView();
      await saveEntrenos();
    });
  });

  // --- Activa ---
  const finishBtn = document.getElementById('finishBtn');
  if(finishBtn) finishBtn.addEventListener('click', finalizarEntreno);

  const addExBtn = document.getElementById('addExActivaBtn');
  if(addExBtn) addExBtn.addEventListener('click', () => openAddExercisePrompt());

  main.querySelectorAll('[data-set-input]').forEach(inp => {
    inp.addEventListener('input', () => {
      const campo = inp.getAttribute('data-set-input');
      const exIdx = parseInt(inp.getAttribute('data-ex'), 10);
      const setIdx = parseInt(inp.getAttribute('data-set'), 10);
      const set = entrenos.activa.ejercicios[exIdx].sets[setIdx];
      set[campo] = inp.value;
      debouncedSaveEntrenos();
    });
  });

  main.querySelectorAll('[data-toggle-set]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const [exIdx, setIdx] = btn.getAttribute('data-toggle-set').split('-').map(Number);
      const set = entrenos.activa.ejercicios[exIdx].sets[setIdx];
      set.hecho = !set.hecho;
      renderEntrenosView();
      await saveEntrenos();
    });
  });

  main.querySelectorAll('[data-del-set]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const [exIdx, setIdx] = btn.getAttribute('data-del-set').split('-').map(Number);
      entrenos.activa.ejercicios[exIdx].sets.splice(setIdx, 1);
      renderEntrenosView();
      await saveEntrenos();
    });
  });

  main.querySelectorAll('[data-add-set]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const exIdx = parseInt(btn.getAttribute('data-add-set'), 10);
      const ej = entrenos.activa.ejercicios[exIdx];
      const last = ej.sets[ej.sets.length - 1];
      ej.sets.push({
        peso:'', reps:'', hecho:false,
        pesoPlaceholder: last ? (last.peso || '') : '',
        repsPlaceholder: last ? (last.reps || '') : ''
      });
      renderEntrenosView();
      await saveEntrenos();
    });
  });

  main.querySelectorAll('[data-del-ex-activa]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const exIdx = parseInt(btn.getAttribute('data-del-ex-activa'), 10);
      const ej = entrenos.activa.ejercicios[exIdx];
      if(confirm('¿Quitar "'+ej.nombre+'" de este entrenamiento?')){
        entrenos.activa.ejercicios.splice(exIdx, 1);
        renderEntrenosView();
        await saveEntrenos();
      }
    });
  });

  // --- Historial ---
  main.querySelectorAll('[data-del-hist]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-del-hist');
      if(confirm('¿Eliminar esta sesión del historial?')){
        entrenos.historial = entrenos.historial.filter(s => s.id !== id);
        renderEntrenosView();
        await saveEntrenos();
      }
    });
  });
}

async function finalizarEntreno(){
  if(!entrenos.activa) return;
  const setsHechos = entrenos.activa.ejercicios.reduce((n, ej) =>
    n + (ej.sets || []).filter(s => s.hecho).length, 0);
  if(setsHechos === 0){
    if(!confirm('No marcaste ningún set como hecho. ¿Terminar de todos modos? (No se guardará en historial)')) return;
    entrenos.activa = null;
    entSub = 'rutinas';
    renderEntrenosView();
    await saveEntrenos();
    return;
  }
  const sesion = {
    id: 's_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    nombre: entrenos.activa.nombre,
    fecha: new Date().toISOString(),
    duracionMs: Date.now() - entrenos.activa.inicioMs,
    volumen: calcVolumen(entrenos.activa.ejercicios),
    ejercicios: entrenos.activa.ejercicios.map(ej => ({
      nombre: ej.nombre,
      grupo: ej.grupo,
      sets: (ej.sets || []).filter(s => s.hecho).map(s => ({
        peso: s.peso, reps: s.reps, hecho: true
      }))
    }))
  };
  entrenos.historial.push(sesion);
  entrenos.activa = null;
  entSub = 'historial';
  renderEntrenosView();
  await saveEntrenos();
  showToast('Entrenamiento guardado 💪');
}

function openAddExercisePrompt(){
  const nombre = prompt('Nombre del ejercicio:');
  if(!nombre || !nombre.trim()) return;
  const grupo = prompt('Grupo muscular (opcional, ej: Pecho, Espalda):') || '';
  entrenos.activa.ejercicios.push({
    nombre: nombre.trim(),
    grupo: grupo.trim(),
    sets: [{ peso:'', reps:'', hecho:false, pesoPlaceholder:'', repsPlaceholder:'' }]
  });
  renderEntrenosView();
  saveEntrenos();
}

function openRutinaModal(editId){
  const editing = editId ? rutinaById(editId) : null;
  const draft = editing
    ? JSON.parse(JSON.stringify(editing))
    : { id:null, nombre:'', ejercicios: [] };

  function render(){
    const root = document.getElementById('modalRoot');
    let exHtml = draft.ejercicios.map((ej, idx) =>
      '<div class="cat-manage-row">'
      + '<span class="name">'+escapeHtml(ej.nombre)+(ej.grupo ? ' <span style="color:var(--muted)">· '+escapeHtml(ej.grupo)+'</span>' : '')
      + '<br><span style="color:var(--muted); font-size:11px">'+ej.setsObjetivo+' sets × '+ej.repsObjetivo+' reps</span></span>'
      + '<button class="del-link" data-del-draft-ex="'+idx+'">Quitar</button>'
      + '</div>'
    ).join('');
    if(!exHtml) exHtml = '<p style="color:var(--muted); font-size:12.5px; text-align:center; padding:8px 0;">Sin ejercicios aún.</p>';

    root.innerHTML = '<div class="modal-overlay" id="overlay">'
      + '<div class="modal">'
      + '<h2>'+(editing?'Editar rutina':'Nueva rutina')+'</h2>'
      + '<span class="field-label">Nombre de la rutina</span>'
      + '<input class="name-input" id="rutNombre" placeholder="Ej: Push día A" maxlength="50" value="'+escapeAttr(draft.nombre)+'">'
      + '<span class="field-label">Ejercicios</span>'
      + '<div class="cat-manage-list" id="exList">'+exHtml+'</div>'
      + '<div class="cat-add-row" style="flex-wrap:wrap; gap:6px;">'
      + '<input class="name-input" id="newExNombre" placeholder="Nombre ejercicio" style="flex:2 1 100%; margin-bottom:0" maxlength="40">'
      + '<input class="name-input" id="newExGrupo" placeholder="Grupo (opcional)" style="flex:1 1 100%; margin-bottom:0" maxlength="20">'
      + '<input class="name-input" id="newExSets" type="number" min="1" max="20" placeholder="Sets" value="3" style="flex:1; margin-bottom:0">'
      + '<input class="name-input" id="newExReps" placeholder="Reps (ej: 8-10)" style="flex:2; margin-bottom:0" maxlength="10">'
      + '<button class="add-btn" id="addExBtn" style="flex-basis:100%; padding:10px 0">+ Agregar ejercicio</button>'
      + '</div>'
      + '<div class="modal-actions">'
      + '<button class="btn btn-secondary" id="cancelBtn">Cancelar</button>'
      + '<button class="btn btn-primary" id="saveBtn">'+(editing?'Guardar':'Crear')+'</button>'
      + '</div></div></div>';

    document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id==='overlay') closeModal(); });
    document.getElementById('cancelBtn').addEventListener('click', closeModal);

    document.querySelectorAll('[data-del-draft-ex]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.getAttribute('data-del-draft-ex'), 10);
        // preservar el nombre actual antes de re-renderizar
        draft.nombre = document.getElementById('rutNombre').value;
        draft.ejercicios.splice(idx, 1);
        render();
      });
    });

    document.getElementById('addExBtn').addEventListener('click', () => {
      const nombre = document.getElementById('newExNombre').value.trim();
      const grupo = document.getElementById('newExGrupo').value.trim();
      const setsObjetivo = parseInt(document.getElementById('newExSets').value, 10) || 3;
      const repsObjetivo = document.getElementById('newExReps').value.trim() || '8-10';
      if(!nombre){ document.getElementById('newExNombre').focus(); return; }
      draft.nombre = document.getElementById('rutNombre').value;
      draft.ejercicios.push({ nombre, grupo, setsObjetivo, repsObjetivo });
      render();
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const nombre = document.getElementById('rutNombre').value.trim();
      if(!nombre){ document.getElementById('rutNombre').focus(); return; }
      if(draft.ejercicios.length === 0){ showToast('Agrega al menos un ejercicio'); return; }
      if(editing){
        editing.nombre = nombre;
        editing.ejercicios = draft.ejercicios;
      } else {
        const id = 'rut_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
        entrenos.rutinas.push({ id, nombre, ejercicios: draft.ejercicios });
      }
      closeModal();
      renderEntrenosView();
      await saveEntrenos();
    });

    if(!editing) setTimeout(()=>{ document.getElementById('rutNombre').focus(); }, 50);
  }
  render();
}

function openHorarioModal(){
  const root = document.getElementById('modalRoot');
  const ramoOptions = uni.ramos.map(r => '<option value="'+r.id+'">'+escapeHtml(r.nombre)+'</option>').join('');
  const dayOptions = DAYS_ORDER.map(d => '<option value="'+d+'"'+(d===uniDay?' selected':'')+'>'+DAYS_LABEL[d]+'</option>').join('');

  root.innerHTML = '<div class="modal-overlay" id="overlay">'
    + '<div class="modal">'
    + '<h2>Nuevo bloque de horario</h2>'
    + '<span class="field-label">Ramo</span>'
    + '<select class="name-input" id="blockRamo">'+ramoOptions+'</select>'
    + '<span class="field-label">Día</span>'
    + '<select class="name-input" id="blockDia">'+dayOptions+'</select>'
    + '<span class="field-label">Hora inicio</span>'
    + '<input type="time" class="name-input" id="blockInicio" value="08:30">'
    + '<span class="field-label">Hora término</span>'
    + '<input type="time" class="name-input" id="blockFin" value="09:50">'
    + '<span class="field-label">Sala (opcional)</span>'
    + '<input class="name-input" id="blockSala" placeholder="Ej: Sala 304" maxlength="30">'
    + '<div class="modal-actions">'
    + '<button class="btn btn-secondary" id="cancelBtn">Cancelar</button>'
    + '<button class="btn btn-primary" id="saveBtn">Crear</button>'
    + '</div></div></div>';

  document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id==='overlay') closeModal(); });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', async () => {
    const ramoId = document.getElementById('blockRamo').value;
    const dia = parseInt(document.getElementById('blockDia').value, 10);
    const horaInicio = document.getElementById('blockInicio').value;
    const horaFin = document.getElementById('blockFin').value;
    if(!ramoId || !horaInicio || !horaFin) return;
    if(horaFin <= horaInicio){ showToast('La hora de término debe ser después del inicio.'); return; }
    const id = 'b_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    uni.horario.push({ id, ramoId, dia, horaInicio, horaFin, sala: document.getElementById('blockSala').value.trim() });
    uniDay = dia;
    closeModal();
    renderUniversidadView();
    debouncedSaveUni();
  });
}

function openTareaModal(){
  const root = document.getElementById('modalRoot');
  const ramoOptions = '<option value="">Sin ramo</option>' + uni.ramos.map(r => '<option value="'+r.id+'">'+escapeHtml(r.nombre)+'</option>').join('');

  root.innerHTML = '<div class="modal-overlay" id="overlay">'
    + '<div class="modal">'
    + '<h2>Nueva tarea</h2>'
    + '<span class="field-label">Título</span>'
    + '<input class="name-input" id="tareaTitulo" placeholder="Ej: Entregar informe de laboratorio" maxlength="80">'
    + '<span class="field-label">Ramo</span>'
    + '<select class="name-input" id="tareaRamo">'+ramoOptions+'</select>'
    + '<span class="field-label">Fecha límite</span>'
    + '<input type="date" class="name-input" id="tareaFecha" value="'+todayISO()+'">'
    + '<span class="field-label">Prioridad</span>'
    + '<select class="name-input" id="tareaPrioridad">'
    + '<option value="media" selected>Media</option>'
    + '<option value="alta">Alta</option>'
    + '<option value="baja">Baja</option>'
    + '</select>'
    + '<div class="modal-actions">'
    + '<button class="btn btn-secondary" id="cancelBtn">Cancelar</button>'
    + '<button class="btn btn-primary" id="saveBtn">Crear</button>'
    + '</div></div></div>';

  document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id==='overlay') closeModal(); });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', async () => {
    const titulo = document.getElementById('tareaTitulo').value.trim();
    if(!titulo){ document.getElementById('tareaTitulo').focus(); return; }
    const id = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    uni.tareas.push({
      id, titulo,
      ramoId: document.getElementById('tareaRamo').value || null,
      fecha: document.getElementById('tareaFecha').value || todayISO(),
      prioridad: document.getElementById('tareaPrioridad').value,
      completada: false
    });
    closeModal();
    renderUniversidadView();
    debouncedSaveUni();
  });

  setTimeout(()=>{ document.getElementById('tareaTitulo').focus(); }, 50);
}

function handleFabClick(){
  if(currentTab === 'habitos'){
    openModal();
  } else if(currentTab === 'universidad'){
    if(uniSub === 'ramos'){
      openRamoModal();
    } else if(uniSub === 'horario'){
      if(uni.ramos.length === 0){ uniSub = 'ramos'; renderUniversidadView(); showToast('Agrega un ramo primero'); return; }
      openHorarioModal();
    } else {
      openTareaModal();
    }
  } else if(currentTab === 'notas'){
    notaDetailId = 'nueva';
    renderTab();
  } else if(currentTab === 'recordatorios'){
    openRecModal();
  } else if(currentTab === 'entrenos'){
    if(entSub === 'rutinas') openRutinaModal();
  }
}

document.getElementById('fabBtn').addEventListener('click', handleFabClick);

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    if(tab.classList.contains('disabled')) return;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.getAttribute('data-tab');
    renderTab();
  });
});

(async function init(){
  setDateLabel();
  if(typeof window.storage === 'undefined'){
    // Modo PWA / servido: no hay storage de Claude, usamos solo localStorage
    window.storage = {
      get: async (key) => {
        const val = localStorage.getItem(key);
        return val ? { key, value: val, shared: false } : null;
      },
      set: async (key, value) => {
        localStorage.setItem(key, value);
        return { key, value, shared: false };
      },
      delete: async (key) => {
        localStorage.removeItem(key);
        return { key, deleted: true, shared: false };
      },
      list: async () => ({ keys: Object.keys(localStorage), shared: false })
    };
  }
  document.getElementById('mainView').innerHTML = '<div class="empty"><p>Cargando…</p></div>';
  await loadData();
  await loadUni();
  await loadNotas();
  await loadRecs();
  await loadEntrenos();
  renderTab();
  // Programar notificaciones para los recordatorios ya existentes
  scheduleAllNotifications();
})();

// Registrar service worker para funcionalidad PWA
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('Service Worker registrado:', reg.scope))
      .catch(err => console.warn('Service Worker no registrado:', err));
  });
}
</script>
