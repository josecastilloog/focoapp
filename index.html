<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foco">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Foco</title>
<style>
  :root{
    --bg:#17161A;
    --surface:#201E22;
    --surface-2:#2B282C;
    --line:#3B373B;
    --text:#ECE8E9;
    --muted:#A19A9C;
    --mint:#8C3A4A;
    --mint-dim:#4A2129;
    --amber:#B8586A;
    --danger:#C0525F;
    --radius:16px;
    --radius-sm:11px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.18), 0 1px 1px rgba(0,0,0,0.10);
    --shadow-2: 0 8px 24px rgba(0,0,0,0.28), 0 2px 8px rgba(0,0,0,0.18);
    --shadow-mint: 0 10px 28px rgba(140,58,74,0.35);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --dur-fast: .14s;
    --dur-mid: .22s;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 50% -10%, rgba(140,58,74,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:84px;
  }
  header.top{
    padding:30px 20px 20px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0;
    background:rgba(23,22,26,0.85);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    z-index:5;
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  }
  .header-text{ min-width:0; }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--mint);
    font-weight:600;
    margin:0 0 6px;
  }
  h1{
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:-0.015em;
    font-weight:700;
  }
  .subdate{
    color:var(--muted);
    font-size:13.5px;
    margin:0;
  }
  .header-actions{ display:flex; gap:8px; flex-shrink:0; padding-top:2px; }
  .icon-action-btn{
    width:38px; height:38px; border-radius:11px;
    background:var(--surface); border:1px solid var(--line);
    color:var(--muted); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast) ease, color var(--dur-fast) ease, background var(--dur-fast) ease;
  }
  .icon-action-btn:hover{ color:var(--text); border-color:#4A454A; }
  .icon-action-btn:active{ transform:scale(0.9); }
  main{ flex:1; padding:20px 16px 8px; max-width:560px; width:100%; margin:0 auto; animation: viewIn var(--dur-mid) var(--ease-out); }
  @media (min-width:900px){
    main{ max-width:760px; }
    .summary-row{ display:grid; grid-template-columns:repeat(4,1fr); }
    body{ padding-bottom:88px; }
  }
  @keyframes viewIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .summary-row{
    display:flex; gap:10px; margin-bottom:22px;
  }
  .summary-card{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:var(--shadow-1);
    transition:transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast) ease;
  }
  .summary-num{ font-size:24px; font-weight:700; line-height:1; letter-spacing:-0.01em; }
  .summary-label{ font-size:11.5px; color:var(--muted); margin-top:6px; letter-spacing:0.02em; }
  .habit-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    box-shadow:var(--shadow-1);
    transition:border-color var(--dur-fast) ease, transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) ease;
    animation: cardIn var(--dur-mid) var(--ease-out) backwards;
  }
  .habit-card:hover{ border-color:#454045; }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .habit-top{
    display:flex; align-items:center; gap:12px;
  }
  .habit-emoji{
    width:42px;height:42px;border-radius:12px;
    background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    font-size:20px; flex-shrink:0;
  }
  .habit-info{ flex:1; min-width:0; }
  .habit-name{ font-size:15.5px; font-weight:600; margin:0 0 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .habit-streak{ font-size:12.5px; color:var(--amber); display:flex; align-items:center; gap:4px; }
  .check-btn{
    width:44px;height:44px;border-radius:50%;
    border:2px solid var(--line);
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    cursor:pointer;
    flex-shrink:0;
    transition:transform var(--dur-fast) var(--ease-spring), background var(--dur-fast) ease, border-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease;
    color:var(--muted);
  }
  .check-btn:active{ transform:scale(0.88); }
  .check-btn.done{
    background:var(--mint);
    border-color:var(--mint);
    color:#F3E7E9;
    box-shadow:0 4px 14px rgba(140,58,74,0.45);
    animation: checkPop .32s var(--ease-spring);
  }
  @keyframes checkPop{
    0%{ transform:scale(0.7); }
    60%{ transform:scale(1.12); }
    100%{ transform:scale(1); }
  }
  .chain{
    display:flex; gap:6px; margin-top:14px;
  }
  .chain-day{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .chain-dot{
    width:100%;
    aspect-ratio:1;
    border-radius:8px;
    background:var(--surface-2);
    border:1px solid var(--line);
    cursor:pointer;
    transition:transform .1s var(--ease-spring), background var(--dur-fast) ease, border-color var(--dur-fast) ease, opacity var(--dur-fast) ease;
  }
  .chain-dot:hover{ border-color:#524B4E; }
  .chain-dot:active{ transform:scale(0.88); }
  .chain-dot.filled{
    background:var(--mint-dim);
    border-color:var(--mint);
    position:relative;
  }
  .chain-dot.filled.today{
    background:var(--mint);
  }
  .chain-dot.future{
    opacity:0.3;
    cursor:not-allowed;
  }
  .chain-dot.rest{
    opacity:0.28;
    cursor:default;
    background:transparent;
    border-style:dashed;
  }
  .chain-dot.rest:active{ transform:none; }
  /* Insignias */
  .badges-row{ display:flex; gap:5px; margin-top:10px; flex-wrap:wrap; }
  .badge{
    display:inline-flex; align-items:center; gap:4px;
    padding:3px 8px 3px 6px; border-radius:20px;
    font-size:10.5px; font-weight:700;
    background:var(--surface-2); border:1px solid var(--line);
    color:var(--muted);
  }
  .badge .b-icon{ font-size:12px; line-height:1; }
  .badge.tier-bronce{ background:rgba(184,110,80,0.15); border-color:#8B5A3F; color:#D89570; }
  .badge.tier-plata{ background:rgba(180,180,200,0.15); border-color:#8A8FA0; color:#C8CDD8; }
  .badge.tier-oro{ background:rgba(212,175,55,0.15); border-color:#B8993D; color:#E8C868; }
  .badge.tier-legendario{
    background:linear-gradient(135deg, rgba(140,58,74,0.25), rgba(232,200,104,0.15));
    border-color:var(--mint); color:var(--text);
  }
  /* Pop-up de insignia desbloqueada */
  .badge-popup-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.75);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    animation: fadeInBg 0.3s ease-out;
  }
  @keyframes fadeInBg { from{opacity:0} to{opacity:1} }
  .badge-popup{
    background:var(--surface);
    border:2px solid var(--mint);
    border-radius:20px;
    padding:32px 26px 24px;
    text-align:center;
    max-width:300px;
    width:85%;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow:0 20px 60px rgba(140,58,74,0.4);
  }
  @keyframes popIn {
    from{ transform:scale(0.5); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  .badge-popup .medal{
    font-size:64px;
    margin-bottom:10px;
    display:inline-block;
    animation: shine 1.5s ease-in-out infinite;
  }
  @keyframes shine {
    0%,100%{ transform:scale(1) rotate(0deg); }
    50%{ transform:scale(1.1) rotate(-5deg); }
  }
  .badge-popup h2{
    color:var(--mint); font-size:16px;
    letter-spacing:0.08em; text-transform:uppercase;
    margin:0 0 6px;
  }
  .badge-popup .streak-num{
    font-size:44px; font-weight:800;
    color:var(--text); line-height:1; margin:8px 0 4px;
  }
  .badge-popup .streak-lbl{
    font-size:13px; color:var(--muted); margin:0 0 20px;
  }
  .badge-popup .habit-name-pop{
    font-size:14px; color:var(--text);
    padding:8px 12px; background:var(--surface-2);
    border-radius:8px; margin-bottom:18px;
  }
  .badge-popup .close-btn{
    padding:12px 32px; background:var(--mint); color:#F3E7E9;
    border:none; border-radius:10px; font-weight:600;
    font-size:14px; font-family:inherit; cursor:pointer;
    width:100%;
  }
  .chain-label{
    font-size:9.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .habit-actions{
    display:flex; justify-content:flex-end; margin-top:10px;
  }
  .del-link{
    font-size:11.5px;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    padding:4px 6px;
  }
  .del-link:active{ color:var(--danger); }
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .empty-emoji{ font-size:36px; margin-bottom:10px; }
  .empty p{ font-size:14px; line-height:1.5; margin:0; }
  .fab{
    position:fixed;
    bottom:92px; right:20px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--mint);
    color:#F3E7E9;
    border:none;
    font-size:28px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-mint);
    cursor:pointer;
    z-index:20;
    transition:transform var(--dur-fast) var(--ease-spring), box-shadow var(--dur-fast) ease;
  }
  .fab:hover{ transform:translateY(-2px); box-shadow:0 14px 32px rgba(140,58,74,0.45); }
  .fab:active{ transform:scale(0.92); }
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(32,30,34,0.9);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  @media (min-width:900px){
    nav.tabbar{ max-width:760px; left:50%; transform:translateX(-50%); border-radius:18px 18px 0 0; border-left:1px solid var(--line); border-right:1px solid var(--line); }
  }
  .tab{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:7px 0;
    background:none; border:none;
    color:var(--muted);
    font-size:10.5px;
    font-family:inherit;
    border-radius:10px;
    transition:color var(--dur-fast) ease, transform var(--dur-fast) var(--ease-out);
  }
  .tab .tab-icon{ font-size:18px; display:block; transition:transform var(--dur-fast) var(--ease-spring); }
  .tab.active{ color:var(--mint); }
  .tab.active .tab-icon{ transform:translateY(-1px) scale(1.08); }
  .tab:active{ transform:scale(0.94); }
  .tab.disabled{ opacity:0.45; }
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(2px);
    display:flex; align-items:flex-end;
    z-index:30;
    animation: fadeInBg var(--dur-mid) ease-out;
  }
  @media (min-width:640px){
    .modal-overlay{ align-items:center; justify-content:center; }
    .modal{ max-width:460px; border-radius:20px; max-height:88vh; overflow-y:auto; }
  }
  .modal{
    background:var(--surface);
    width:100%;
    border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    box-shadow:var(--shadow-2);
    animation: modalUp var(--dur-mid) var(--ease-out);
  }
  @keyframes modalUp{
    from{ transform:translateY(16px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }
  .modal h2{ font-size:17px; margin:0 0 16px; }
  .field-label{ font-size:12px; color:var(--muted); margin-bottom:6px; display:block; }
  .emoji-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .emoji-opt{
    width:40px;height:40px;border-radius:10px;
    background:var(--surface-2); border:2px solid transparent;
    font-size:18px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .emoji-opt.selected{ border-color:var(--mint); }
  input.name-input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-size:15px;
    margin-bottom:18px;
    font-family:inherit;
  }
  input.name-input:focus{ outline:2px solid var(--mint); border-color:transparent; }
  .modal-actions{ display:flex; gap:10px; }
  .btn{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:none;
    font-size:14.5px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:transform var(--dur-fast) var(--ease-out), filter var(--dur-fast) ease, opacity var(--dur-fast) ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--mint); color:#F3E7E9; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-secondary{ background:var(--surface-2); color:var(--text); }
  .btn-secondary:hover{ filter:brightness(1.15); }
  .btn:disabled{ opacity:0.4; }
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background:var(--surface-2);
    border:1px solid var(--line);
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    z-index:40;
    box-shadow:var(--shadow-2);
    animation: toastIn var(--dur-mid) var(--ease-spring);
  }
  @keyframes toastIn{
    from{ transform:translate(-50%,-10px); opacity:0; }
    to{ transform:translate(-50%,0); opacity:1; }
  }
  .placeholder-view{
    text-align:center; padding:80px 24px; color:var(--muted);
  }
  .placeholder-view .big{ font-size:34px; margin-bottom:12px; }
  .placeholder-view h2{ color:var(--text); font-size:17px; margin:0 0 6px; }
  .placeholder-view p{ font-size:13.5px; line-height:1.5; margin:0; }
  .segmented{ display:flex; gap:6px; margin-bottom:18px; }
  .seg-btn{
    flex:1; padding:9px 0; text-align:center;
    border-radius:10px; background:var(--surface-2);
    border:1px solid var(--line); color:var(--muted);
    font-size:12.5px; font-weight:600; font-family:inherit; cursor:pointer;
    transition:background var(--dur-fast) ease, color var(--dur-fast) ease, border-color var(--dur-fast) ease, transform var(--dur-fast) var(--ease-out);
  }
  .seg-btn.active{ background:var(--mint); color:#F3E7E9; border-color:var(--mint); }
  .seg-btn:active{ transform:scale(0.97); }
  select.name-input{ appearance:none; -webkit-appearance:none; cursor:pointer; }
  input[type=date].name-input, input[type=time].name-input{ color-scheme:dark; }
  .empty-small{ text-align:center; padding:44px 20px; color:var(--muted); font-size:13.5px; line-height:1.5; }
  .empty-small .btn{ margin-top:14px; max-width:180px; margin-left:auto; margin-right:auto; }
  .color-row{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .color-opt{
    width:32px;height:32px;border-radius:50%;
    border:2px solid transparent; cursor:pointer;
    flex-shrink:0;
  }
  .color-opt.selected{ border-color:var(--text); }
  .ramo-card{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
  }
  .ramo-dot{ width:14px; height:14px; border-radius:50%; flex-shrink:0; }
  .ramo-info{ flex:1; min-width:0; }
  .ramo-name{ font-size:14.5px; font-weight:600; margin:0 0 2px; }
  .ramo-meta{ font-size:12px; color:var(--muted); margin:0; }
  .day-picker{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; }
  .day-chip{
    flex:0 0 auto; padding:8px 13px; border-radius:10px;
    background:var(--surface-2); border:1px solid var(--line);
    color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .day-chip.active{ background:var(--mint); color:#F3E7E9; border-color:var(--mint); }
  .block-card{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--mint);
    border-radius:var(--radius); padding:12px 16px; margin-bottom:10px;
  }
  .block-time{ font-size:11.5px; color:var(--muted); font-weight:600; width:60px; flex-shrink:0; line-height:1.3; }
  .block-info{ flex:1; min-width:0; }
  .block-name{ font-size:14px; font-weight:600; margin:0 0 2px; }
  .block-room{ font-size:11.5px; color:var(--muted); margin:0; }
  .tarea-card{
    display:flex; align-items:flex-start; gap:12px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
  }
  .tarea-check{
    width:22px;height:22px;border-radius:6px;border:2px solid var(--line);
    flex-shrink:0; margin-top:1px; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent;
  }
  .tarea-check.done{ background:var(--mint); border-color:var(--mint); color:#F3E7E9; }
  .tarea-info{ flex:1; min-width:0; }
  .tarea-title{ font-size:14.5px; font-weight:600; margin:0 0 6px; }
  .tarea-title.done{ text-decoration:line-through; color:var(--muted); }
  .tarea-meta{ display:flex; gap:7px; align-items:center; flex-wrap:wrap; font-size:11.5px; color:var(--muted); }
  .tarea-ramo-tag{ padding:2px 8px; border-radius:6px; font-size:10.5px; font-weight:600; color:#F3E7E9; }
  .tarea-date{ font-weight:600; }
  .tarea-date.overdue{ color:var(--danger); }
  .prio-badge{ padding:2px 8px; border-radius:6px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; }
  .prio-alta{ background:var(--mint); color:#F3E7E9; }
  .prio-media{ background:transparent; border:1px solid var(--amber); color:var(--amber); }
  .prio-baja{ background:var(--surface-2); color:var(--muted); }
  .section-label{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; font-weight:600; margin:20px 0 10px; }
  .cat-filter{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px; }
  .cat-chip{
    flex:0 0 auto; padding:7px 13px; border-radius:20px;
    background:var(--surface-2); border:1px solid var(--line);
    color:var(--muted); font-size:12.5px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .cat-chip.active{ background:var(--mint); color:#F3E7E9; border-color:var(--mint); }
  .cat-chip .cat-dot{ width:8px; height:8px; border-radius:50%; }
  .note-card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    border-left:4px solid var(--line);

<body>
<header class="top">
  <div class="header-text">
    <p class="eyebrow">Foco</p>

<div id="modalRoot"></div>
<div id="toastRoot" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
const EMOJIS = ['💧','📚','🏃','🧘','☀️','🛌','🥗','✍️','💪','🎯'];
const STORAGE_KEY = 'habit-tracker-data';
let state = { habits: [], completions: {} };
let selectedEmoji = EMOJIS[0];
let currentTab = 'habitos';
let habitsView = 'semanal'; // 'semanal' | 'mensual'
let showLogros = false;
let selectedFrequency = 'daily'; // 'daily' | 'weekly' | 'specific' -- estado del modal de nuevo hábito
let selectedDaysPerWeek = 3;
let selectedSpecificDays = [];
function debounce(fn, delay){
  let timer = null;

function notifState(){
  if(!('Notification' in window)) return 'unsupported';
  return Notification.permission; // 'default' | 'granted' | 'denied'
}
async function requestNotifPermission(){
  if(!('Notification' in window)){
    showToast('Este navegador no soporta notificaciones');
    return;
  }
  const result = await Notification.requestPermission();
  if(result === 'granted'){
    showToast('Notificaciones activadas ✓');
    scheduleAllNotifications();
  } else if(result === 'denied'){
    showToast('Notificaciones bloqueadas');
  }
  renderTab();
}
function fireNotification(rec){
  if(notifState() !== 'granted') return;
  const opts = {
    body: 'Recordatorio programado',
    icon: 'icon-192.png',
    badge: 'icon-192.png',
    tag: 'rec_' + rec.id,
    requireInteraction: false
  };
  // Preferir service worker (funciona mejor cuando la pestaña no está enfocada)
  if(navigator.serviceWorker && navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({
      type: 'SHOW_NOTIFICATION',
      payload: { title: rec.titulo, body: opts.body, tag: opts.tag }
    });
  } else {
    try{ new Notification(rec.titulo, opts); }catch(e){}
  }
}
function nextOccurrenceMs(rec, fromMs){
  // Devuelve el próximo timestamp en ms desde fromMs (o null si ya no aplica)
  const baseMs = new Date(rec.fecha + 'T' + rec.hora).getTime();
  if(rec.repeticion === 'ninguna'){
    return baseMs > fromMs ? baseMs : null;
  }
  if(baseMs > fromMs) return baseMs;
  // Avanzar según repetición hasta pasar fromMs
  const d = new Date(baseMs);
  const step = () => {
    if(rec.repeticion === 'diaria') d.setDate(d.getDate() + 1);
    else if(rec.repeticion === 'semanal') d.setDate(d.getDate() + 7);
    else if(rec.repeticion === 'mensual') d.setMonth(d.getMonth() + 1);
  };
  let guard = 0;
  while(d.getTime() <= fromMs && guard < 10000){ step(); guard++; }
  return d.getTime();
}
function clearAllTimers(){
  Object.values(notifTimers).forEach(id => clearTimeout(id));
  notifTimers = {};
}
function scheduleNotificationFor(rec){
  if(notifTimers[rec.id]){ clearTimeout(notifTimers[rec.id]); delete notifTimers[rec.id]; }
  if(rec.completado && rec.repeticion === 'ninguna') return;
  if(notifState() !== 'granted') return;
  const now = Date.now();
  const next = nextOccurrenceMs(rec, now);
  if(next === null) return;
  const delay = next - now;
  // setTimeout se rompe con delays > ~24 días. Solo agendamos si es dentro de 24h.
  const MAX = 24 * 60 * 60 * 1000;
  if(delay > MAX) return;
  notifTimers[rec.id] = setTimeout(() => {
    fireNotification(rec);
    // Si tiene repetición, reagendamos automáticamente
    if(rec.repeticion !== 'ninguna'){
      scheduleNotificationFor(rec);
    } else {
      // Uso único: quedará marcado como pasado en la próxima renderización
    }
    if(currentTab === 'recordatorios') renderTab();
  }, delay);
}
function scheduleAllNotifications(){
  clearAllTimers();
  recs.items.forEach(scheduleNotificationFor);
}

// --- Frecuencia personalizada de hábitos ---
// Un hábito viejo (sin campos nuevos) se comporta como frequency:'daily' por defecto.
function habitFrequency(habit){
  return (habit && habit.frequency) || 'daily';
}
function habitAppliesOnISO(habit, iso){
  const freq = habitFrequency(habit);
  if(freq === 'specific'){
    const days = (habit && habit.specificDays) || [];
    if(days.length === 0) return true; // sin días elegidos: tratamos como aplica siempre (evita bloqueo total)
    const d = new Date(iso+'T00:00:00');
    return days.includes(d.getDay());
  }
  // 'daily' y 'weekly' aplican (o pueden completarse) cualquier día
  return true;
}
function habitAppliesToday(habit){
  return habitAppliesOnISO(habit, todayISO());
}
function getHabitIcon(h){
  if(h && h.name){
    const m = h.name.match(/\p{Extended_Pictographic}/u);
    if(m) return m[0];
  }
  return (h && h.emoji) || '⭐';
}
function habitFrequencyLabel(habit){
  const freq = habitFrequency(habit);
  if(freq === 'weekly') return (habit.daysPerWeek||3)+'x por semana';
  if(freq === 'specific'){
    const days = (habit.specificDays||[]).slice().sort();
    if(days.length === 0) return 'Días específicos';
    return days.map(d => DAY_LETTERS[d]).join('');
  }
  return 'Diario';
}
function mondayOfWeek(d){
  const dow = d.getDay();
  const diff = dow === 0 ? 6 : dow - 1;
  const m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  m.setDate(m.getDate() - diff);
  return m;
}
function isoOf(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function computeWeeklyStreak(habitId, habit){
  const dates = state.completions[habitId] || {};
  const target = Math.max(1, habit.daysPerWeek || 3);
  const today = todayISO();
  let weekStart = mondayOfWeek(new Date());
  let streakWeeks = 0;
  let guard = 0;
  while(guard < 520){
    guard++;
    let count = 0;
    for(let i=0;i<7;i++){
      const d = new Date(weekStart); d.setDate(weekStart.getDate()+i);
      const iso = isoOf(d);
      if(iso > today) continue;
      if(dates[iso]) count++;
    }
    const isCurrentWeek = guard === 1;
    if(count >= target){
      streakWeeks++;
    } else if(!isCurrentWeek){
      break;
    }
    // si es la semana actual y aún no cumple la meta, no rompe la racha todavía (semana en curso)
    weekStart.setDate(weekStart.getDate() - 7);
  }
  return streakWeeks;
}
function computeStreak(habitId){
  const habit = state.habits.find(h => h.id === habitId);
  const freq = habitFrequency(habit);
  if(freq === 'weekly'){
    return computeWeeklyStreak(habitId, habit || { daysPerWeek: 3 });
  }
  const dates = state.completions[habitId] || {};
  let streak = 0;
  let dayOffset = 0;
  const today = todayISO();
  const appliesToday = habitAppliesOnISO(habit || {}, today);
  if(appliesToday && !dates[today]){
    dayOffset = 1; // start checking from yesterday
  }
  let guard = 0;
  while(guard < 3660){
    guard++;
    const iso = isoDaysAgo(dayOffset);
    if(!habitAppliesOnISO(habit || {}, iso)){
      dayOffset++;
      continue;
    }
    if(dates[iso]){
      streak++;
      dayOffset++;
    } else {
      break;
    }
  }
  return streak;
}
function renderChain(habitId, habit){
  const dates = state.completions[habitId] || {};
  const today = todayISO();
  // Calcular el lunes de la semana actual
  const now = new Date();
  const dayOfWeek = now.getDay(); // 0=Domingo, 1=Lunes, ..., 6=Sábado
  // Cuántos días retroceder desde hoy hasta el lunes de esta semana
  const daysFromMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  const monday = new Date(now);
  monday.setDate(now.getDate() - daysFromMonday);
  const weekDayLabels = ['L','M','M','J','V','S','D']; // Lun-Dom
  let html = '';
  for(let i=0; i<7; i++){
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const filled = !!dates[iso];
    const isToday = iso === today;
    const isFuture = iso > today;
    const applicable = habit ? habitAppliesOnISO(habit, iso) : true;
    const isRest = !applicable;
    const cls = 'chain-dot' + (filled?' filled':'') + (isToday?' today':'') + (isFuture?' future':'') + (isRest?' rest':'');
    const interactive = !isFuture && !isRest;
    let dayLabel = d.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'short' });
    dayLabel = dayLabel.charAt(0).toUpperCase()+dayLabel.slice(1);
    const stateLabel = isRest ? 'día de descanso' : (isFuture ? 'día futuro' : (filled ? 'completado' : 'sin completar'));
    html += '<div class="chain-day">'
          + '<div class="'+cls+'" data-date="'+iso+'" data-habit="'+habitId+'"'
          + (interactive ? ' role="button" tabindex="0" aria-pressed="'+filled+'"' : ' aria-hidden="true"')
          + ' aria-label="'+dayLabel+', '+stateLabel+'"></div>'
          + '<div class="chain-label" aria-hidden="true">'+weekDayLabels[i]+'</div>'
          + '</div>';
  }
  return html;
}
function toggleHabitCompletion(id, date){
  if(!state.completions[id]) state.completions[id] = {};
  if(state.completions[id][date]){
    delete state.completions[id][date];
  } else {
    state.completions[id][date] = true;
  }
  checkAndAwardBadges(id);
}

      + '<div class="habit-top">'

      + '</div>'

  main.querySelectorAll('.chain-dot').forEach(dot => {
    dot.addEventListener('click', async () => {
      if(dot.classList.contains('future') || dot.classList.contains('rest')) return;

      debouncedSaveData();
    });
    dot.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); dot.click(); }
    });
  });
  main.querySelectorAll('.month-cell').forEach(cell => {
    cell.addEventListener('click', async () => {
      if(cell.classList.contains('future') || cell.classList.contains('rest')) return;

      }
    });
  });
}

function buildMonthGridHtml(habit){
  const DAYS_BACK = 42; // 6 semanas
  const today = todayISO();
  const dates = state.completions[habit.id] || {};
  const now = new Date();
  let cells = '';
  for(let i = DAYS_BACK - 1; i >= 0; i--){

    const applicable = habitAppliesOnISO(habit, iso);
    const isRest = !applicable;
    const cls = 'month-cell' + (filled?' filled':'') + (isFuture?' future':'') + (isRest?' rest':'');
    const titleTxt = d.toLocaleDateString('es-ES', { day:'numeric', month:'short' });
    const stateLabel = isRest ? 'día de descanso' : (isFuture ? 'día futuro' : (filled ? 'completado' : 'sin completar'));
    cells += '<div class="'+cls+'" data-date="'+iso+'" data-habit="'+habit.id+'" title="'+titleTxt+'" role="button" aria-label="'+titleTxt+', '+stateLabel+'"></div>';

    + '</div>';
}
// --- Gráfico de progreso mensual (SVG puro) ---
function buildProgressChartHtml(){
  const DAYS = 30;
  const now = new Date();
  const today = todayISO();
  const points = [];
  for(let i = DAYS - 1; i >= 0; i--){
    const d = new Date(now);
    d.setDate(now.getDate() - i);
    const iso = isoOf(d);
    const relevant = state.habits.filter(h => (!h.createdAt || h.createdAt <= iso) && habitAppliesOnISO(h, iso));
    const total = relevant.length;
    const done = relevant.filter(h => (state.completions[h.id]||{})[iso]).length;
    const pct = total > 0 ? Math.round((done/total)*100) : 0;
    points.push({ iso, pct });
  }
  const w = 300, h = 90, pad = 4;
  const stepX = (w - pad*2) / (DAYS - 1);
  const scaleY = (pct) => h - pad - (pct/100)*(h - pad*2);
  const linePoints = points.map((p,i) => (pad + i*stepX)+','+scaleY(p.pct)).join(' ');
  const areaPoints = 'M'+(pad)+','+(h-pad)+' L'+points.map((p,i) => (pad + i*stepX)+','+scaleY(p.pct)).join(' L')+' L'+(w-pad)+','+(h-pad)+' Z';
  const avg = points.length ? Math.round(points.reduce((s,p)=>s+p.pct,0)/points.length) : 0;
  return '<div class="progress-chart-card">'
    + '<div class="progress-chart-head"><p class="progress-chart-title">Progreso últimos 30 días</p><span class="progress-chart-sub">Promedio '+avg+'%</span></div>'
    + '<svg class="progress-chart-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'
    + '<defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="#8C3A4A" stop-opacity="0.45"/>'
    + '<stop offset="100%" stop-color="#8C3A4A" stop-opacity="0"/>'
    + '</linearGradient></defs>'
    + '<path d="'+areaPoints+'" fill="url(#chartFill)" stroke="none"></path>'
    + '<polyline points="'+linePoints+'" fill="none" stroke="#8C3A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>'
    + '</svg>'
    + '</div>';
}

function formatShortDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  if(isToday){
    return d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
  }
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short' });
}

function renderRecordatoriosView(){
  const main = document.getElementById('mainView');
  let html = '';

  if(nState === 'default'){
    html += '<div class="notif-banner">'
      + '<p>Para que Foco te avise a la hora del recordatorio, necesitamos permiso de notificaciones.</p>'
      + '<button class="btn btn-primary" id="askNotif">Activar notificaciones</button>'
      + '</div>';
  } else if(nState === 'denied'){
    html += '<div class="notif-banner">'
      + '<p>Las notificaciones están bloqueadas. Puedes activarlas desde los permisos del sitio en tu navegador.</p>'
      + '</div>';
  } else if(nState === 'unsupported'){
    html += '<div class="notif-banner">'
      + '<p>Tu navegador no soporta notificaciones. Los recordatorios funcionan como lista.</p>'
      + '</div>';
  }
  if(recs.items.length === 0){
    html += '<div class="empty-small">Sin recordatorios.<br>Toca + para crear el primero.</div>';
    main.innerHTML = html;
    attachRecListeners();
    return;
  }
  const now = Date.now();
  const enriched = recs.items.map(r => {
    const nextMs = nextOccurrenceMs(r, now - 60000); // ventana atrás de 1 min para "hace un momento"
    return { ...r, _nextMs: nextMs };
  });
  const proximos = enriched
    .filter(r => !r.completado && r._nextMs !== null)
    .sort((a,b) => a._nextMs - b._nextMs);
  const pasados = enriched
    .filter(r => r.completado || r._nextMs === null)
    .sort((a,b) => {
      const aMs = new Date(a.fecha+'T'+a.hora).getTime();
      const bMs = new Date(b.fecha+'T'+b.hora).getTime();
      return bMs - aMs;
    });
  if(proximos.length > 0){
    proximos.forEach(r => html += recCardHtml(r, now));
  } else {
    html += '<div class="empty-small">Sin recordatorios próximos 🎉</div>';
  }
  if(pasados.length > 0){
    html += '<p class="section-label">Pasados</p>';
    pasados.forEach(r => html += recCardHtml(r, now, true));
  }
  main.innerHTML = html;
  attachRecListeners();
}
function recCardHtml(r, now, esPasado){
  const nextMs = r._nextMs;
  const displayMs = nextMs !== null ? nextMs : new Date(r.fecha+'T'+r.hora).getTime();
  const d = new Date(displayMs);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const fechaDisplay = formatRelDate(d);
  const vencido = !esPasado && nextMs !== null && nextMs < now;
  const repLabel = { ninguna:'Única', diaria:'Diaria', semanal:'Semanal', mensual:'Mensual' }[r.repeticion] || 'Única';
  return '<div class="rec-card">'
    + '<div class="rec-time-block">'
    + '<p class="rec-time">'+hh+':'+mm+'</p>'
    + '<p class="rec-date">'+fechaDisplay+'</p>'
    + '</div>'
    + '<div class="rec-info">'
    + '<p class="rec-title'+(esPasado?' pasado':'')+'">'+escapeHtml(r.titulo)+'</p>'
    + '<div class="rec-meta">'
    + '<span class="rec-repeat-badge">'+repLabel+'</span>'
    + (vencido ? '<span class="rec-vencido">⚠ vencido</span>' : '')
    + '</div>'
    + '</div>'
    + '<div class="rec-actions">'
    + '<button class="icon-btn" data-edit-rec="'+r.id+'" title="Editar" aria-label="Editar recordatorio \''+escapeAttr(r.titulo)+'\'">✎</button>'
    + '<button class="icon-btn" data-toggle-rec="'+r.id+'" title="'+(r.completado?'Reactivar':'Marcar hecho')+'" aria-label="'+(r.completado?'Reactivar':'Marcar hecho')+' recordatorio \''+escapeAttr(r.titulo)+'\'">'+(r.completado?'↺':'✓')+'</button>'
    + '<button class="icon-btn" data-del-rec="'+r.id+'" title="Eliminar" aria-label="Eliminar recordatorio \''+escapeAttr(r.titulo)+'\'">🗑</button>'
    + '</div>'
    + '</div>';
}
function formatRelDate(d){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.round((target - today) / 86400000);
  if(diffDays === 0) return 'Hoy';
  if(diffDays === 1) return 'Mañana';
  if(diffDays === -1) return 'Ayer';
  if(diffDays > 1 && diffDays < 7) return d.toLocaleDateString('es-ES', { weekday:'short' });
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short' });
}

function nowPlusMinutes(min){
  const d = new Date(Date.now() + min * 60000);
  const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const hora = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return { fecha: iso, hora };
}

  ordenados.forEach(s => {
    const totalSets = (s.ejercicios || []).reduce((sum, e) => sum + (e.sets || []).filter(x => x.hecho).length, 0);
    const volumen = s.volumen || 0;
    const dur = s.duracionMs ? formatDuration(s.duracionMs) : '—';
    const exNames = (s.ejercicios || []).map(e => e.nombre).join(', ');
    const fechaObj = new Date(s.fecha);
    const fechaDisplay = fechaObj.toLocaleDateString('es-ES', { day:'numeric', month:'short' });
    html += '<div class="hist-card">'
      + '<div class="hist-top"><p class="hist-name">'+escapeHtml(s.nombre)+'</p><span class="hist-date">'+fechaDisplay+'</span></div>'
      + '<div class="hist-stats">'
      + '<div class="hist-stat"><span class="hist-stat-val">'+dur+'</span><span class="hist-stat-lbl">Duración</span></div>'
      + '<div class="hist-stat"><span class="hist-stat-val">'+totalSets+'</span><span class="hist-stat-lbl">Sets</span></div>'
      + '<div class="hist-stat"><span class="hist-stat-val">'+Math.round(volumen)+' kg</span><span class="hist-stat-lbl">Volumen</span></div>'
      + '</div>'
      + '<p class="hist-exlist">'+escapeHtml(exNames)+'</p>'
      + '<div class="rutina-actions" style="margin-top:10px">'
      + '<button class="btn-sm btn-outline" data-del-hist="'+s.id+'">Eliminar</button>'
      + '</div>'
      + '</div>';
  });
  return html;
}
function startRestTimer(seconds, exIdx){
  restTimerState.active = true;
  restTimerState.endMs = Date.now() + seconds * 1000;
  restTimerState.exIdx = exIdx;
  restTimerState.notified = false;
  if(restTimerInterval) clearInterval(restTimerInterval);
  restTimerInterval = setInterval(updateRestBar, 250);
}
function stopRestTimer(){
  restTimerState.active = false;
  restTimerState.endMs = 0;
  restTimerState.exIdx = null;
  if(restTimerInterval){ clearInterval(restTimerInterval); restTimerInterval = null; }
  // Remover la barra sin re-renderizar toda la vista
  const bar = document.getElementById('restBar');
  if(bar) bar.remove();
}
function updateRestBar(){
  if(!restTimerState.active) return;
  const remaining = restTimerState.endMs - Date.now();
  const bar = document.getElementById('restBar');
  const display = document.getElementById('restTimeDisplay');
  if(remaining <= 0){
    // Descanso terminado
    if(!restTimerState.notified){
      restTimerState.notified = true;
      // Vibración si el dispositivo soporta
      if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
      // Notificación del sistema si tiene permiso
      if(typeof notifState === 'function' && notifState() === 'granted'){
        if(navigator.serviceWorker && navigator.serviceWorker.controller){
          navigator.serviceWorker.controller.postMessage({
            type: 'SHOW_NOTIFICATION',
            payload: { title: '¡Descanso terminado!', body: 'Es hora del siguiente set 💪', tag: 'rest_done' }
          });
        }
      }
      // Cambiar el estilo de la barra a "done" sin re-renderizar la vista completa
      if(bar){
        bar.classList.add('done');
        // Reconstruir contenido interno de la barra (label, tiempo, botones)
        bar.innerHTML = '<div class="rest-info">'
          + '<div class="rest-label">Descanso terminado</div>'
          + '<div class="rest-time" id="restTimeDisplay">¡Listo!</div>'
          + '</div>'
          + '<div class="rest-actions">'
          + '<button data-rest-skip>Cerrar</button>'
          + '</div>';
        // Reconectar handler del botón cerrar
        const skipBtn = bar.querySelector('[data-rest-skip]');
        if(skipBtn) skipBtn.addEventListener('click', stopRestTimer);
      }
    }
    return;
  }
  if(display){
    display.textContent = formatDuration(remaining);
  }
}
function startActiveTimer(){
  stopActiveTimer();
  const update = () => {
    const el = document.getElementById('activeTimer');
    if(el && entrenos.activa){
      el.textContent = formatDuration(Date.now() - entrenos.activa.inicioMs);
    }
  };
  update();
  activeTimerInterval = setInterval(update, 1000);
}
function stopActiveTimer(){
  if(activeTimerInterval){ clearInterval(activeTimerInterval); activeTimerInterval = null; }
}
function attachEntrenosListeners(){
  const main = document.getElementById('mainView');
  main.querySelectorAll('[data-ent-seg]').forEach(btn => {
    btn.addEventListener('click', () => {
      entSub = btn.getAttribute('data-ent-seg');
      renderEntrenosView();
    });
  });
  // --- Rutinas ---
  main.querySelectorAll('[data-edit-rutina]').forEach(btn => {
    btn.addEventListener('click', () => openRutinaModal(btn.getAttribute('data-edit-rutina')));
  });
  main.querySelectorAll('[data-start-rutina]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-start-rutina');
      const rutina = rutinaById(id);
      if(!rutina) return;
      entrenos.activa = {
        rutinaId: id,
        nombre: rutina.nombre,
        inicioMs: Date.now(),
        ejercicios: (rutina.ejercicios || []).map(ej => ({
          nombre: ej.nombre,
          grupo: ej.grupo || '',
          restTime: ej.restTime || 90,
          sets: Array.from({length: ej.setsObjetivo || 3}, () => ({
            peso:'', reps:'', hecho:false,
            pesoPlaceholder:'', repsPlaceholder: ej.repsObjetivo || ''
          }))
        }))
      };
      entSub = 'activa';
      renderEntrenosView();
      await saveEntrenos();
    });
  });
  // --- Activa ---
  const finishBtn = document.getElementById('finishBtn');
  if(finishBtn) finishBtn.addEventListener('click', finalizarEntreno);
  const addExBtn = document.getElementById('addExActivaBtn');
  if(addExBtn) addExBtn.addEventListener('click', () => openAddExercisePrompt());
  main.querySelectorAll('[data-set-input]').forEach(inp => {
    inp.addEventListener('input', () => {
      const campo = inp.getAttribute('data-set-input');
      const exIdx = parseInt(inp.getAttribute('data-ex'), 10);
      const setIdx = parseInt(inp.getAttribute('data-set'), 10);
      const set = entrenos.activa.ejercicios[exIdx].sets[setIdx];
      set[campo] = inp.value;
      debouncedSaveEntrenos();
    });
  });
  main.querySelectorAll('[data-toggle-set]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const [exIdx, setIdx] = btn.getAttribute('data-toggle-set').split('-').map(Number);
      const set = entrenos.activa.ejercicios[exIdx].sets[setIdx];
      const wasChecked = set.hecho;
      set.hecho = !set.hecho;
      // Si acabamos de marcarlo como hecho (no si lo desmarcamos), arrancar cronómetro de descanso
      if(!wasChecked && set.hecho){
        const ej = entrenos.activa.ejercicios[exIdx];
        const rest = ej.restTime || 90;
        startRestTimer(rest, exIdx);
      }
      renderEntrenosView();
      await saveEntrenos();
    });
  });
  // Selector de tiempo de descanso por ejercicio
  main.querySelectorAll('[data-rest-set]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const [exIdx, time] = btn.getAttribute('data-rest-set').split('-').map(Number);
      entrenos.activa.ejercicios[exIdx].restTime = time;
      renderEntrenosView();
      await saveEntrenos();
    });
  });
  // Botones de la barra de descanso
  const restAddBtn = main.querySelector('[data-rest-add]');
  if(restAddBtn){
    restAddBtn.addEventListener('click', () => {
      const add = parseInt(restAddBtn.getAttribute('data-rest-add'), 10) * 1000;
      restTimerState.endMs += add;
      updateRestBar();
    });
  }
  const restSkipBtn = main.querySelector('[data-rest-skip]');
  if(restSkipBtn){
    restSkipBtn.addEventListener('click', stopRestTimer);
  }
  main.querySelectorAll('[data-del-set]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const [exIdx, setIdx] = btn.getAttribute('data-del-set').split('-').map(Number);
      entrenos.activa.ejercicios[exIdx].sets.splice(setIdx, 1);
      renderEntrenosView();
      await saveEntrenos();
    });
  });
  main.querySelectorAll('[data-add-set]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const exIdx = parseInt(btn.getAttribute('data-add-set'), 10);
      const ej = entrenos.activa.ejercicios[exIdx];
      const last = ej.sets[ej.sets.length - 1];
      ej.sets.push({
        peso:'', reps:'', hecho:false,
        pesoPlaceholder: last ? (last.peso || '') : '',
        repsPlaceholder: last ? (last.reps || '') : ''
      });
      renderEntrenosView();
      await saveEntrenos();
    });
  });
  main.querySelectorAll('[data-del-ex-activa]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const exIdx = parseInt(btn.getAttribute('data-del-ex-activa'), 10);
      const ej = entrenos.activa.ejercicios[exIdx];
      if(confirm('¿Quitar "'+ej.nombre+'" de este entrenamiento?')){
        entrenos.activa.ejercicios.splice(exIdx, 1);
        renderEntrenosView();
        await saveEntrenos();
      }
    });
  });
  // --- Historial ---
  main.querySelectorAll('[data-del-hist]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-del-hist');
      if(confirm('¿Eliminar esta sesión del historial?')){
        entrenos.historial = entrenos.historial.filter(s => s.id !== id);
        renderEntrenosView();
        await saveEntrenos();
      }
    });
  });
}
async function finalizarEntreno(){
  if(!entrenos.activa) return;
  const setsHechos = entrenos.activa.ejercicios.reduce((n, ej) =>
    n + (ej.sets || []).filter(s => s.hecho).length, 0);
  if(setsHechos === 0){
    if(!confirm('No marcaste ningún set como hecho. ¿Terminar de todos modos? (No se guardará en historial)')) return;
    stopRestTimer();
    entrenos.activa = null;
    entSub = 'rutinas';
    renderEntrenosView();
    await saveEntrenos();
    return;
  }
  const sesion = {
    id: 's_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    nombre: entrenos.activa.nombre,
    fecha: new Date().toISOString(),
    duracionMs: Date.now() - entrenos.activa.inicioMs,
    volumen: calcVolumen(entrenos.activa.ejercicios),
    ejercicios: entrenos.activa.ejercicios.map(ej => ({
      nombre: ej.nombre,
      grupo: ej.grupo,
      sets: (ej.sets || []).filter(s => s.hecho).map(s => ({
        peso: s.peso, reps: s.reps, hecho: true
      }))
    }))
  };
  stopRestTimer();
  entrenos.historial.push(sesion);
  entrenos.activa = null;
  entSub = 'historial';
  renderEntrenosView();
  await saveEntrenos();
  showToast('Entrenamiento guardado 💪');
}
function openAddExercisePrompt(){
  openExerciseCatalog((seleccionados) => {
    // Callback: agregar los ejercicios seleccionados al entrenamiento activo
    seleccionados.forEach(({ nombre, grupo }) => {
      entrenos.activa.ejercicios.push({
        nombre, grupo,
        restTime: 90,
        sets: [{ peso:'', reps:'', hecho:false, pesoPlaceholder:'', repsPlaceholder:'' }]
      });
    });
    renderEntrenosView();
    saveEntrenos();
  });
}
function openExerciseCatalog(onConfirm, preSelected){
  // onConfirm recibe un array de {nombre, grupo}
  // preSelected: array opcional de nombres ya seleccionados
  const selected = new Set(preSelected || []);
  let searchQuery = '';
  function render(){
    const root = document.getElementById('modalRoot');
    const q = searchQuery.trim().toLowerCase();
    let groupsHtml = '';
    Object.entries(EJERCICIOS_CATALOGO).forEach(([grupo, ejercicios]) => {
      const filtered = ejercicios.filter(e => !q || e.toLowerCase().includes(q));
      if(filtered.length === 0) return;
      groupsHtml += '<div class="catalog-group">'
        + '<p class="catalog-group-title">'+grupo+'</p>';
      filtered.forEach(nombre => {
        const isSel = selected.has(nombre);
        groupsHtml += '<div class="catalog-ex'+(isSel?' selected':'')+'" data-catalog-ex="'+escapeAttr(nombre)+'" data-catalog-grupo="'+grupo+'">'
          + '<span>'+escapeHtml(nombre)+'</span>'
          + '<span class="plus-icon">'+(isSel?'✓':'+')+'</span>'
          + '</div>';
      });
      groupsHtml += '</div>';
    });
    if(!groupsHtml){
      groupsHtml = '<div class="empty-small">Sin resultados para "'+escapeHtml(searchQuery)+'"</div>';
    }
    const selCount = selected.size;
    root.innerHTML = '<div class="modal-overlay" id="overlay">'
      + '<div class="modal" style="max-height:85vh; overflow-y:auto;">'
      + '<h2>Ejercicios <span style="color:var(--muted); font-size:12px; font-weight:normal;">'+(selCount>0?'· '+selCount+' seleccionado'+(selCount===1?'':'s'):'')+'</span></h2>'
      + '<input class="catalog-search" id="catalogSearch" placeholder="Buscar ejercicio..." value="'+escapeAttr(searchQuery)+'">'
      + groupsHtml
      + '<button class="catalog-custom-btn" id="catalogCustomBtn">+ Agregar ejercicio personalizado</button>'
      + '<div class="modal-actions" style="margin-top:16px">'
      + '<button class="btn btn-secondary" id="cancelBtn">Cancelar</button>'
      + '<button class="btn btn-primary" id="confirmBtn"'+(selCount===0?' disabled':'')+'>Agregar '+(selCount>0?'('+selCount+')':'')+'</button>'
      + '</div></div></div>';
    // Search input mantiene el foco
    const searchInput = document.getElementById('catalogSearch');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      // Guardar posición del cursor para restaurarla
      const pos = e.target.selectionStart;
      render();
      const newInput = document.getElementById('catalogSearch');
      if(newInput){ newInput.focus(); newInput.setSelectionRange(pos, pos); }
    });
    // Selección de ejercicios (toggle)
    document.querySelectorAll('[data-catalog-ex]').forEach(el => {
      el.addEventListener('click', () => {
        const nombre = el.getAttribute('data-catalog-ex');
        if(selected.has(nombre)) selected.delete(nombre);
        else selected.add(nombre);
        render();
      });
    });
    // Agregar ejercicio personalizado
    document.getElementById('catalogCustomBtn').addEventListener('click', () => {
      const nombre = prompt('Nombre del ejercicio personalizado:');
      if(!nombre || !nombre.trim()) return;
      const grupo = prompt('Grupo muscular (Pecho, Espalda, Piernas, Hombros, Bíceps, Tríceps, Core, u otro):') || 'Otro';
      // Agregar al set de seleccionados con su grupo
      const nombreTrim = nombre.trim();
      selected.add(nombreTrim);
      // Guardar el grupo del custom para el callback
      customGrupos[nombreTrim] = grupo.trim() || 'Otro';
      render();
    });
    document.getElementById('overlay').addEventListener('click', (e) => {
      if(e.target.id === 'overlay') closeModal();
    });
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    const confirmBtn = document.getElementById('confirmBtn');
    if(selCount > 0){
      confirmBtn.addEventListener('click', () => {
        // Construir la lista con grupo correspondiente
        const result = Array.from(selected).map(nombre => {
          // Buscar el grupo en el catálogo
          let grupo = customGrupos[nombre] || 'Otro';
          for(const [g, exs] of Object.entries(EJERCICIOS_CATALOGO)){
            if(exs.includes(nombre)){ grupo = g; break; }
          }
          return { nombre, grupo };
        });
        closeModal();
        onConfirm(result);
      });
    }
  }
  const customGrupos = {};
  render();
}
function openRutinaModal(editId){

    ? JSON.parse(JSON.stringify(editing))

  function render(){

    let exHtml = draft.ejercicios.map((ej, idx) =>
      '<div class="cat-manage-row">'
      + '<span class="name">'+escapeHtml(ej.nombre)+(ej.grupo ? ' <span style="color:var(--muted)">· '+escapeHtml(ej.grupo)+'</span>' : '')
      + '<br><span style="color:var(--muted); font-size:11px">'
      + '<input type="number" min="1" max="20" value="'+(ej.setsObjetivo||3)+'" data-draft-sets="'+idx+'" style="width:38px; background:var(--bg); border:1px solid var(--line); border-radius:4px; color:var(--text); padding:2px 4px; font-size:11px; text-align:center; font-family:inherit;"> sets × '
      + '<input type="text" value="'+escapeAttr(ej.repsObjetivo||'8-10')+'" data-draft-reps="'+idx+'" style="width:50px; background:var(--bg); border:1px solid var(--line); border-radius:4px; color:var(--text); padding:2px 4px; font-size:11px; text-align:center; font-family:inherit;"> reps'
      + '</span></span>'
      + '<button class="del-link" data-del-draft-ex="'+idx+'">Quitar</button>'
      + '</div>'
    ).join('');
    if(!exHtml) exHtml = '<p style="color:var(--muted); font-size:12.5px; text-align:center; padding:12px 0;">Sin ejercicios aún. Toca el botón de abajo para agregar del catálogo.</p>';
    root.innerHTML = '<div class="modal-overlay" id="overlay">'
      + '<div class="modal">'
      + '<h2>'+(editing?'Editar rutina':'Nueva rutina')+'</h2>'
      + '<span class="field-label">Nombre de la rutina</span>'
      + '<input class="name-input" id="rutNombre" placeholder="Ej: Push día A" maxlength="50" value="'+escapeAttr(draft.nombre)+'">'
      + '<span class="field-label">Ejercicios</span>'
      + '<div class="cat-manage-list" id="exList">'+exHtml+'</div>'
      + '<button class="catalog-custom-btn" id="openCatalogBtn">+ Elegir del catálogo</button>'
      + '<div class="modal-actions" style="margin-top:16px">'
      + '<button class="btn btn-secondary" id="cancelBtn">Cancelar</button>'
      + '<button class="btn btn-primary" id="saveBtn">'+(editing?'Guardar':'Crear')+'</button>'
      + '</div></div></div>';
    document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id==='overlay') closeModal(); });
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    // Guardar cambios de sets/reps al vuelo
    document.querySelectorAll('[data-draft-sets]').forEach(inp => {
      inp.addEventListener('change', () => {
        const idx = parseInt(inp.getAttribute('data-draft-sets'), 10);
        const val = parseInt(inp.value, 10);
        if(val >= 1 && val <= 20) draft.ejercicios[idx].setsObjetivo = val;
      });
    });
    document.querySelectorAll('[data-draft-reps]').forEach(inp => {
      inp.addEventListener('change', () => {
        const idx = parseInt(inp.getAttribute('data-draft-reps'), 10);
        draft.ejercicios[idx].repsObjetivo = inp.value.trim() || '8-10';
      });
    });
    document.querySelectorAll('[data-del-draft-ex]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.getAttribute('data-del-draft-ex'), 10);
        draft.nombre = document.getElementById('rutNombre').value;
        draft.ejercicios.splice(idx, 1);
        render();
      });
    });
    document.getElementById('openCatalogBtn').addEventListener('click', () => {
      // Guardar el nombre antes de abrir el catálogo (para no perderlo)
      draft.nombre = document.getElementById('rutNombre').value;
      const yaSeleccionados = draft.ejercicios.map(e => e.nombre);
      openExerciseCatalog((seleccionados) => {
        // Agregar solo los que no estaban
        seleccionados.forEach(({ nombre, grupo }) => {
          if(!draft.ejercicios.find(e => e.nombre === nombre)){
            draft.ejercicios.push({ nombre, grupo, setsObjetivo: 3, repsObjetivo: '8-10' });
          }
        });
        render();
      }, yaSeleccionados);
    });
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const nombre = document.getElementById('rutNombre').value.trim();
      if(!nombre){ document.getElementById('rutNombre').focus(); return; }
      if(draft.ejercicios.length === 0){ showToast('Agrega al menos un ejercicio'); return; }
      if(editing){
        editing.nombre = nombre;
        editing.ejercicios = draft.ejercicios;
      } else {
        const id = 'rut_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
        entrenos.rutinas.push({ id, nombre, ejercicios: draft.ejercicios });
      }
      closeModal();
      renderEntrenosView();
      await saveEntrenos();
    });
    if(!editing) setTimeout(()=>{ document.getElementById('rutNombre').focus(); }, 50);
  }
  render();
}

  document.querySelectorAll('[data-freq]').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedFrequency = btn.getAttribute('data-freq');
      rerender();
    });
  });
  document.querySelectorAll('[data-dpw]').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedDaysPerWeek = parseInt(btn.getAttribute('data-dpw'), 10);
      rerender();
    });
  });
  document.querySelectorAll('[data-freq-day]').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = parseInt(btn.getAttribute('data-freq-day'), 10);
      const idx = selectedSpecificDays.indexOf(d);

// --- Accesibilidad de modales: foco atrapado, cierre con Esc, foco devuelto al cerrar ---
function setupModalAccessibility(){
  const modalRoot = document.getElementById('modalRoot');
  let previouslyFocused = null;
  function focusableIn(container){
    return Array.from(container.querySelectorAll(
      'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
    )).filter(el => el.offsetParent !== null);
  }
  new MutationObserver(() => {
    const overlay = modalRoot.firstElementChild;
    if(overlay){
      if(!previouslyFocused) previouslyFocused = document.activeElement;
      const dialog = overlay.querySelector('.modal, .badge-popup') || overlay;
      if(!dialog.hasAttribute('role')){ dialog.setAttribute('role','dialog'); dialog.setAttribute('aria-modal','true'); }
      if(!dialog.contains(document.activeElement)){
        const first = focusableIn(dialog)[0];
        if(first) first.focus();
      }
    } else if(previouslyFocused){
      if(document.body.contains(previouslyFocused)) previouslyFocused.focus();
      previouslyFocused = null;
    }
  }).observe(modalRoot, { childList: true });
  document.addEventListener('keydown', (e) => {
    const overlay = modalRoot.firstElementChild;
    if(!overlay) return;
    if(e.key === 'Escape'){
      overlay.click();
    } else if(e.key === 'Tab'){
      const dialog = overlay.querySelector('.modal, .badge-popup') || overlay;
      const items = focusableIn(dialog);
      if(items.length === 0) return;
      const first = items[0], last = items[items.length - 1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });
}
// --- Ajustes / copia de seguridad ---
function collectBackupData(){
  return {
    app: 'Foco',
    version: 1,
    exportedAt: new Date().toISOString(),
    habitos: state,
    universidad: uni,
    notas: notas,
    recordatorios: recs,
    entrenos: entrenos
  };
}
function exportBackup(){
  const data = collectBackupData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayISO();
  a.href = url;
  a.download = 'foco-backup-'+stamp+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Copia de seguridad descargada ✓');
}
async function applyBackup(data){
  if(!data || typeof data !== 'object') throw new Error('Archivo inválido');
  if(data.habitos && data.habitos.habits) state = data.habitos;
  if(data.universidad && data.universidad.ramos) uni = data.universidad;
  if(data.notas && data.notas.items) notas = data.notas;
  if(data.recordatorios && data.recordatorios.items) recs = data.recordatorios;
  if(data.entrenos && data.entrenos.rutinas) entrenos = data.entrenos;
  await saveData();
  await saveUni();
  await saveNotas();
  await saveRecs();
  scheduleAllNotifications();
  currentTab = 'habitos';
  document.querySelectorAll('.tab').forEach(t=>{
    const isHabitos = t.getAttribute('data-tab') === 'habitos';
    t.classList.toggle('active', isHabitos);
    t.setAttribute('aria-selected', String(isHabitos));
  });
  renderTab();
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('Esto reemplazará los datos actuales de la app con los del archivo. ¿Continuar?')) return;
      await applyBackup(data);
      closeModal();
      showToast('Copia de seguridad restaurada ✓');
    }catch(e){
      console.error('Error importando copia de seguridad:', e);
      showToast('No se pudo leer el archivo. ¿Es un backup de Foco válido?');
    }
  };
  reader.onerror = () => showToast('No se pudo leer el archivo');
  reader.readAsText(file);
}

(async function init(){
  setDateLabel();
  setupModalAccessibility();
  setupHeaderActions();
  if(typeof window.storage === 'undefined'){
    // Modo PWA / servido: no hay storage de Claude, usamos solo localStorage
    window.storage = {
      get: async (key) => {
        const val = localStorage.getItem(key);
        return val ? { key, value: val, shared: false } : null;
      },
      set: async (key, value) => {
        localStorage.setItem(key, value);
        return { key, value, shared: false };
      },
      delete: async (key) => {
        localStorage.removeItem(key);
        return { key, deleted: true, shared: false };
      },
      list: async () => ({ keys: Object.keys(localStorage), shared: false })
    };
  }
  document.getElementById('mainView').innerHTML = '<div class="app-loading" role="status"><div class="spinner" aria-hidden="true"></div><p>Cargando…</p></div>';
  await loadData();
  await loadUni();
  await loadNotas();
  await loadRecs();
  await loadEntrenos();
  renderTab();
  // Programar notificaciones para los recordatorios ya existentes
  scheduleAllNotifications();
})();
