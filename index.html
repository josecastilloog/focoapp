<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foco">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Foco</title>
<style>
  :root{
    --bg:#17161A;
    --surface:#201E22;
    --surface-2:#2B282C;
    --line:#3B373B;
    --text:#ECE8E9;
    --muted:#A19A9C;
    --mint:#8C3A4A;
    --mint-dim:#4A2129;
    --amber:#B8586A;
    --danger:#C0525F;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:84px;
  }
  header.top{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--mint);
    font-weight:600;
    margin:0 0 6px;
  }
  h1{
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
    font-weight:700;
  }
  .subdate{
    color:var(--muted);
    font-size:13.5px;
    margin:0;
  }

  main{ flex:1; padding:18px 16px 8px; max-width:560px; width:100%; margin:0 auto; }

  .summary-row{
    display:flex; gap:10px; margin-bottom:20px;
  }
  .summary-card{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .summary-num{ font-size:24px; font-weight:700; line-height:1; }
  .summary-label{ font-size:11.5px; color:var(--muted); margin-top:6px; letter-spacing:0.02em; }

  .habit-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    transition:border-color .15s ease;
  }
  .habit-top{
    display:flex; align-items:center; gap:12px;
  }
  .habit-emoji{
    width:42px;height:42px;border-radius:12px;
    background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    font-size:20px; flex-shrink:0;
  }
  .habit-info{ flex:1; min-width:0; }
  .habit-name{ font-size:15.5px; font-weight:600; margin:0 0 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .habit-streak{ font-size:12.5px; color:var(--amber); display:flex; align-items:center; gap:4px; }
  .check-btn{
    width:44px;height:44px;border-radius:50%;
    border:2px solid var(--line);
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    cursor:pointer;
    flex-shrink:0;
    transition:all .15s ease;
    color:var(--muted);
  }
  .check-btn.done{
    background:var(--mint);
    border-color:var(--mint);
    color:#F3E7E9;
  }
  .chain{
    display:flex; gap:6px; margin-top:14px;
  }
  .chain-day{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .chain-dot{
    width:100%;
    aspect-ratio:1;
    border-radius:8px;
    background:var(--surface-2);
    border:1px solid var(--line);
    cursor:pointer;
    transition:transform .1s ease;
  }
  .chain-dot:active{ transform:scale(0.88); }
  .chain-dot.filled{
    background:var(--mint-dim);
    border-color:var(--mint);
    position:relative;
  }
  .chain-dot.filled.today{
    background:var(--mint);
  }
  .chain-label{
    font-size:9.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .habit-actions{
    display:flex; justify-content:flex-end; margin-top:10px;
  }
  .del-link{
    font-size:11.5px;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    padding:4px 6px;
  }
  .del-link:active{ color:var(--danger); }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .empty-emoji{ font-size:36px; margin-bottom:10px; }
  .empty p{ font-size:14px; line-height:1.5; margin:0; }

  .fab{
    position:fixed;
    bottom:92px; right:20px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--mint);
    color:#F3E7E9;
    border:none;
    font-size:28px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(140,58,74,0.4);
    cursor:pointer;
    z-index:20;
  }

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .tab{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 0;
    background:none; border:none;
    color:var(--muted);
    font-size:10.5px;
    font-family:inherit;
  }
  .tab .tab-icon{ font-size:18px; }
  .tab.active{ color:var(--mint); }
  .tab.disabled{ opacity:0.45; }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    display:flex; align-items:flex-end;
    z-index:30;
  }
  .modal{
    background:var(--surface);
    width:100%;
    border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .modal h2{ font-size:17px; margin:0 0 16px; }
  .field-label{ font-size:12px; color:var(--muted); margin-bottom:6px; display:block; }
  .emoji-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .emoji-opt{
    width:40px;height:40px;border-radius:10px;
    background:var(--surface-2); border:2px solid transparent;
    font-size:18px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .emoji-opt.selected{ border-color:var(--mint); }
  input.name-input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-size:15px;
    margin-bottom:18px;
    font-family:inherit;
  }
  input.name-input:focus{ outline:2px solid var(--mint); border-color:transparent; }
  .modal-actions{ display:flex; gap:10px; }
  .btn{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:none;
    font-size:14.5px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
  }
  .btn-primary{ background:var(--mint); color:#F3E7E9; }
  .btn-secondary{ background:var(--surface-2); color:var(--text); }
  .btn:disabled{ opacity:0.4; }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background:var(--surface-2);
    border:1px solid var(--line);
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    z-index:40;
  }

  .placeholder-view{
    text-align:center; padding:80px 24px; color:var(--muted);
  }
  .placeholder-view .big{ font-size:34px; margin-bottom:12px; }
  .placeholder-view h2{ color:var(--text); font-size:17px; margin:0 0 6px; }
  .placeholder-view p{ font-size:13.5px; line-height:1.5; margin:0; }

  .segmented{ display:flex; gap:6px; margin-bottom:18px; }
  .seg-btn{
    flex:1; padding:9px 0; text-align:center;
    border-radius:10px; background:var(--surface-2);
    border:1px solid var(--line); color:var(--muted);
    font-size:12.5px; font-weight:600; font-family:inherit; cursor:pointer;
  }
  .seg-btn.active{ background:var(--mint); color:#F3E7E9; border-color:var(--mint); }

  select.name-input{ appearance:none; -webkit-appearance:none; cursor:pointer; }
  input[type=date].name-input, input[type=time].name-input{ color-scheme:dark; }

  .empty-small{ text-align:center; padding:44px 20px; color:var(--muted); font-size:13.5px; line-height:1.5; }
  .empty-small .btn{ margin-top:14px; max-width:180px; margin-left:auto; margin-right:auto; }

  .color-row{ display:flex; gap:8px; margin-bottom:18px; }
  .color-opt{
    width:32px;height:32px;border-radius:50%;
    border:2px solid transparent; cursor:pointer;
  }
  .color-opt.selected{ border-color:var(--text); }

  .ramo-card{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
  }
  .ramo-dot{ width:14px; height:14px; border-radius:50%; flex-shrink:0; }
  .ramo-info{ flex:1; min-width:0; }
  .ramo-name{ font-size:14.5px; font-weight:600; margin:0 0 2px; }
  .ramo-meta{ font-size:12px; color:var(--muted); margin:0; }

  .day-picker{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; }
  .day-chip{
    flex:0 0 auto; padding:8px 13px; border-radius:10px;
    background:var(--surface-2); border:1px solid var(--line);
    color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .day-chip.active{ background:var(--mint); color:#F3E7E9; border-color:var(--mint); }

  .block-card{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--mint);
    border-radius:var(--radius); padding:12px 16px; margin-bottom:10px;
  }
  .block-time{ font-size:11.5px; color:var(--muted); font-weight:600; width:60px; flex-shrink:0; line-height:1.3; }
  .block-info{ flex:1; min-width:0; }
  .block-name{ font-size:14px; font-weight:600; margin:0 0 2px; }
  .block-room{ font-size:11.5px; color:var(--muted); margin:0; }

  .tarea-card{
    display:flex; align-items:flex-start; gap:12px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
  }
  .tarea-check{
    width:22px;height:22px;border-radius:6px;border:2px solid var(--line);
    flex-shrink:0; margin-top:1px; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent;
  }
  .tarea-check.done{ background:var(--mint); border-color:var(--mint); color:#F3E7E9; }
  .tarea-info{ flex:1; min-width:0; }
  .tarea-title{ font-size:14.5px; font-weight:600; margin:0 0 6px; }
  .tarea-title.done{ text-decoration:line-through; color:var(--muted); }
  .tarea-meta{ display:flex; gap:7px; align-items:center; flex-wrap:wrap; font-size:11.5px; color:var(--muted); }
  .tarea-ramo-tag{ padding:2px 8px; border-radius:6px; font-size:10.5px; font-weight:600; color:#F3E7E9; }
  .tarea-date{ font-weight:600; }
  .tarea-date.overdue{ color:var(--danger); }
  .prio-badge{ padding:2px 8px; border-radius:6px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; }
  .prio-alta{ background:var(--mint); color:#F3E7E9; }
  .prio-media{ background:transparent; border:1px solid var(--amber); color:var(--amber); }
  .prio-baja{ background:var(--surface-2); color:var(--muted); }
  .section-label{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; font-weight:600; margin:20px 0 10px; }

  .cat-filter{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px; }
  .cat-chip{
    flex:0 0 auto; padding:7px 13px; border-radius:20px;
    background:var(--surface-2); border:1px solid var(--line);
    color:var(--muted); font-size:12.5px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .cat-chip.active{ background:var(--mint); color:#F3E7E9; border-color:var(--mint); }
  .cat-chip .cat-dot{ width:8px; height:8px; border-radius:50%; }

  .note-card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    border-left:4px solid var(--line);
    cursor:pointer;
  }
  .note-top-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .note-title{ font-size:14.5px; font-weight:600; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .note-date{ font-size:11px; color:var(--muted); flex-shrink:0; }
  .note-preview{ font-size:12.5px; color:var(--muted); margin:0 0 8px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .note-cat-tag{ font-size:10.5px; padding:2px 8px; border-radius:6px; font-weight:600; color:#F3E7E9; display:inline-block; }

  textarea.name-input{
    resize:vertical; min-height:160px; font-family:inherit; line-height:1.5;
  }
  .note-detail-actions{ display:flex; gap:10px; margin-top:12px; }
  .cat-manage-list{ margin-bottom:16px; }
  .cat-manage-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; background:var(--surface-2);
    border-radius:10px; margin-bottom:6px;
  }
  .cat-manage-row .cat-dot{ width:12px; height:12px; border-radius:50%; }
  .cat-manage-row .name{ flex:1; font-size:13.5px; }
  .cat-manage-row .del-link{ font-size:11px; }
  .cat-add-row{ display:flex; gap:8px; margin-bottom:16px; }
  .cat-add-row input{ flex:1; margin-bottom:0; }
  .cat-add-row .add-btn{
    padding:0 16px; background:var(--mint); color:#F3E7E9;
    border:none; border-radius:10px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .manage-link{
    background:none; border:none; color:var(--mint);
    font-size:12px; font-family:inherit; cursor:pointer;
    margin-left:auto; padding:0;
  }
</style>
</head>
<body>

<header class="top">
  <p class="eyebrow">Foco</p>
  <h1 id="tabTitle">Hábitos</h1>
  <p class="subdate" id="dateLabel"></p>
</header>

<main id="mainView"></main>

<button class="fab" id="fabBtn" title="Agregar hábito">+</button>

<nav class="tabbar">
  <button class="tab active" data-tab="habitos"><span class="tab-icon">✓</span>Hábitos</button>
  <button class="tab" data-tab="universidad"><span class="tab-icon">🎓</span>Universidad</button>
  <button class="tab" data-tab="notas"><span class="tab-icon">✎</span>Notas</button>
  <button class="tab disabled" data-tab="recordatorios"><span class="tab-icon">🕓</span>Recordatorios</button>
  <button class="tab disabled" data-tab="entrenos"><span class="tab-icon">◆</span>Entrenos</button>
</nav>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const EMOJIS = ['💧','📚','🏃','🧘','☀️','🛌','🥗','✍️','💪','🎯'];
const STORAGE_KEY = 'habit-tracker-data';
let state = { habits: [], completions: {} };
let selectedEmoji = EMOJIS[0];
let currentTab = 'habitos';

function debounce(fn, delay){
  let timer = null;
  return function(...args){
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isoDaysAgo(n){
  const d = new Date();
  d.setDate(d.getDate()-n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const DAY_LETTERS = ['D','L','M','M','J','V','S'];

// --- Módulo Universidad ---
const UNI_KEY = 'universidad-data';
const RAMO_COLORS = ['#8C3A4A','#B8586A','#5B6B7A','#7A7A4A','#6B4A6B','#4A6B7A'];
const DAYS_ORDER = [1,2,3,4,5,6,0];
const DAYS_LABEL = {1:'Lun',2:'Mar',3:'Mié',4:'Jue',5:'Vie',6:'Sáb',0:'Dom'};
let uni = { ramos: [], horario: [], tareas: [] };
let uniSub = 'tareas';
let uniDay = (new Date().getDay());
let selectedRamoColor = RAMO_COLORS[0];

async function loadUni(){
  try{
    const res = await window.storage.get(UNI_KEY, false);
    if(res && res.value){
      uni = JSON.parse(res.value);
      if(!uni.ramos) uni.ramos = [];
      if(!uni.horario) uni.horario = [];
      if(!uni.tareas) uni.tareas = [];
      return;
    }
  }catch(e){
    console.warn('No se pudo cargar universidad desde la nube, usando respaldo local:', e);
  }
  try{
    const local = localStorage.getItem(UNI_KEY);
    if(local){
      uni = JSON.parse(local);
      if(!uni.ramos) uni.ramos = [];
      if(!uni.horario) uni.horario = [];
      if(!uni.tareas) uni.tareas = [];
    }
  }catch(e){
    uni = { ramos: [], horario: [], tareas: [] };
  }
}

async function saveUni(){
  try{ localStorage.setItem(UNI_KEY, JSON.stringify(uni)); }catch(e){}
  try{
    const r = await window.storage.set(UNI_KEY, JSON.stringify(uni), false);
    if(!r) throw new Error('empty result from storage.set');
  }catch(e){
    console.error('Error guardando universidad (intento 1):', e);
    try{
      await new Promise(res => setTimeout(res, 600));
      const r2 = await window.storage.set(UNI_KEY, JSON.stringify(uni), false);
      if(!r2) throw new Error('empty result on retry');
    }catch(e2){
      console.error('Error guardando universidad (intento 2):', e2);
      // datos seguros en respaldo local, no aviso al usuario
    }
  }
}

function ramoById(id){ return uni.ramos.find(r => r.id === id); }

const debouncedSaveUni = debounce(saveUni, 500);

// --- Módulo Notas ---
const NOTAS_KEY = 'notas-data';
const NOTA_COLORS = ['#8C3A4A','#B8586A','#5B6B7A','#7A7A4A','#6B4A6B','#4A6B7A'];
let notas = {
  categorias: [
    { id:'cat_default_1', nombre:'Personal', color:'#8C3A4A' },
    { id:'cat_default_2', nombre:'Ideas', color:'#5B6B7A' }
  ],
  items: []
};
let notasFiltroCat = 'todas';
let notaDetailId = null;

async function loadNotas(){
  try{
    const res = await window.storage.get(NOTAS_KEY, false);
    if(res && res.value){
      notas = JSON.parse(res.value);
      if(!notas.categorias) notas.categorias = [];
      if(!notas.items) notas.items = [];
      return;
    }
  }catch(e){
    console.warn('No se pudo cargar notas desde la nube, usando respaldo local:', e);
  }
  try{
    const local = localStorage.getItem(NOTAS_KEY);
    if(local){
      const parsed = JSON.parse(local);
      if(parsed.categorias && parsed.items){ notas = parsed; }
    }
  }catch(e){}
}

async function saveNotas(){
  try{ localStorage.setItem(NOTAS_KEY, JSON.stringify(notas)); }catch(e){}
  try{
    const r = await window.storage.set(NOTAS_KEY, JSON.stringify(notas), false);
    if(!r) throw new Error('empty result from storage.set');
  }catch(e){
    console.error('Error guardando notas (intento 1):', e);
    try{
      await new Promise(res => setTimeout(res, 600));
      const r2 = await window.storage.set(NOTAS_KEY, JSON.stringify(notas), false);
      if(!r2) throw new Error('empty result on retry');
    }catch(e2){
      console.error('Error guardando notas (intento 2):', e2);
    }
  }
}

const debouncedSaveNotas = debounce(saveNotas, 500);

function catById(id){ return notas.categorias.find(c => c.id === id); }

function setDateLabel(){
  const d = new Date();
  const opts = { weekday:'long', day:'numeric', month:'long' };
  let txt = d.toLocaleDateString('es-ES', opts);
  txt = txt.charAt(0).toUpperCase()+txt.slice(1);
  document.getElementById('dateLabel').textContent = txt;
}

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      state = JSON.parse(res.value);
      if(!state.habits) state.habits = [];
      if(!state.completions) state.completions = {};
      return;
    }
  }catch(e){
    console.warn('No se pudo cargar desde la nube, usando respaldo local:', e);
  }
  // fallback local
  try{
    const local = localStorage.getItem(STORAGE_KEY);
    if(local){
      state = JSON.parse(local);
      if(!state.habits) state.habits = [];
      if(!state.completions) state.completions = {};
    }
  }catch(e){
    state = { habits: [], completions: {} };
  }
}

async function saveData(){
  // respaldo local siempre primero (nunca falla)
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  // luego intento guardar en la nube
  try{
    const result = await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    if(!result){ throw new Error('empty result from storage.set'); }
  }catch(e){
    console.error('Error guardando datos (intento 1):', e);
    try{
      await new Promise(r => setTimeout(r, 600));
      const retryResult = await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
      if(!retryResult){ throw new Error('empty result on retry'); }
    }catch(e2){
      console.error('Error guardando datos (intento 2):', e2);
      // no muestro toast: los datos están seguros en el respaldo local
    }
  }
}

const debouncedSaveData = debounce(saveData, 500);

function showToast(msg){
  const root = document.getElementById('toastRoot');
  root.innerHTML = '<div class="toast">'+msg+'</div>';
  setTimeout(()=>{ root.innerHTML=''; }, 2200);
}

function computeStreak(habitId){
  const dates = state.completions[habitId] || {};
  let streak = 0;
  let cursor = new Date();
  // if today not done, streak counts back from yesterday but only "active" if today or yesterday done
  let dayOffset = 0;
  const today = todayISO();
  if(!dates[today]){
    dayOffset = 1; // start checking from yesterday
  }
  while(true){
    const iso = isoDaysAgo(dayOffset);
    if(dates[iso]){
      streak++;
      dayOffset++;
    } else {
      break;
    }
  }
  return streak;
}

function renderChain(habitId){
  const dates = state.completions[habitId] || {};
  const today = todayISO();
  let html = '';
  for(let i=6;i>=0;i--){
    const iso = isoDaysAgo(i);
    const d = new Date();
    d.setDate(d.getDate()-i);
    const letter = DAY_LETTERS[d.getDay()];
    const filled = !!dates[iso];
    const isToday = iso === today;
    html += '<div class="chain-day">'
          + '<div class="chain-dot'+(filled?' filled':'')+(isToday?' today':'')+'" data-date="'+iso+'" data-habit="'+habitId+'"></div>'
          + '<div class="chain-label">'+letter+'</div>'
          + '</div>';
  }
  return html;
}

function renderHabitsView(){
  const main = document.getElementById('mainView');
  if(state.habits.length === 0){
    main.innerHTML = '<div class="empty"><div class="empty-emoji">🌱</div>'
      + '<p>Todavía no tienes hábitos.<br>Toca el botón + para crear el primero.</p></div>';
    return;
  }

  const doneToday = state.habits.filter(h => (state.completions[h.id]||{})[todayISO()]).length;
  const totalHabits = state.habits.length;
  const bestStreak = Math.max(0, ...state.habits.map(h => computeStreak(h.id)));

  let html = '<div class="summary-row">'
    + '<div class="summary-card"><div class="summary-num">'+doneToday+'/'+totalHabits+'</div><div class="summary-label">Hoy completados</div></div>'
    + '<div class="summary-card"><div class="summary-num">'+bestStreak+'</div><div class="summary-label">Mejor racha</div></div>'
    + '</div>';

  state.habits.forEach(h => {
    const streak = computeStreak(h.id);
    const doneToday = !!(state.completions[h.id]||{})[todayISO()];
    html += '<div class="habit-card">'
      + '<div class="habit-top">'
      + '<div class="habit-emoji">'+h.emoji+'</div>'
      + '<div class="habit-info"><p class="habit-name">'+escapeHtml(h.name)+'</p>'
      + '<p class="habit-streak">'+(streak>0 ? '🔥 '+streak+' día'+(streak===1?'':'s')+' seguidos' : 'Sin racha activa')+'</p></div>'
      + '<button class="check-btn'+(doneToday?' done':'')+'" data-habit="'+h.id+'">'+(doneToday?'✓':'')+'</button>'
      + '</div>'
      + '<div class="chain">'+renderChain(h.id)+'</div>'
      + '<div class="habit-actions"><button class="del-link" data-del="'+h.id+'">Eliminar</button></div>'
      + '</div>';
  });

  main.innerHTML = html;

  main.querySelectorAll('.check-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-habit');
      const today = todayISO();
      if(!state.completions[id]) state.completions[id] = {};
      if(state.completions[id][today]){
        delete state.completions[id][today];
      } else {
        state.completions[id][today] = true;
      }
      renderHabitsView();
      debouncedSaveData();
    });
  });

  main.querySelectorAll('.chain-dot').forEach(dot => {
    dot.addEventListener('click', async () => {
      const id = dot.getAttribute('data-habit');
      const date = dot.getAttribute('data-date');
      if(!state.completions[id]) state.completions[id] = {};
      if(state.completions[id][date]){
        delete state.completions[id][date];
      } else {
        state.completions[id][date] = true;
      }
      renderHabitsView();
      debouncedSaveData();
    });
  });

  main.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-del');
      const habit = state.habits.find(h=>h.id===id);
      if(!habit) return;
      if(confirm('¿Eliminar "'+habit.name+'"? Se perderá su historial.')){
        state.habits = state.habits.filter(h => h.id !== id);
        delete state.completions[id];
        renderHabitsView();
        debouncedSaveData();
      }
    });
  });
}

function buildHorarioHtml(){
  if(uni.ramos.length === 0){
    return '<div class="empty-small">Necesitas al menos un ramo para armar tu horario.'
      + '<br><button class="btn btn-primary" id="goToRamos">Agregar ramo</button></div>';
  }
  let html = '<div class="day-picker">';

    html += '<button class="day-chip'+(uniDay===d?' active':'')+'" data-day="'+d+'">'+DAYS_LABEL[d]+'</button>';
  });
  html += '</div>';

  const blocks = uni.horario.filter(b => b.dia === uniDay)
    .sort((a,b) => a.horaInicio.localeCompare(b.horaInicio));

  if(blocks.length === 0){
    html += '<div class="empty-small">Sin clases este día. Toca + para agregar una.</div>';
    return html;
  }

  blocks.forEach(b => {
    const ramo = ramoById(b.ramoId);
    const color = ramo ? ramo.color : 'var(--line)';
    html += '<div class="block-card" style="border-left-color:'+color+'">'
      + '<div class="block-time">'+b.horaInicio+'<br>'+b.horaFin+'</div>'
      + '<div class="block-info"><p class="block-name">'+escapeHtml(ramo ? ramo.nombre : 'Ramo eliminado')+'</p>'
      + (b.sala ? '<p class="block-room">'+escapeHtml(b.sala)+'</p>' : '')
      + '</div>'
      + '<button class="del-link" data-del-block="'+b.id+'">Eliminar</button>'
      + '</div>';

}

function buildTareasHtml(){
  if(uni.tareas.length === 0){
    return '<div class="empty-small">Sin tareas pendientes.<br>Toca + para agregar una.</div>';
  }
  const today = todayISO();
  const pendientes = uni.tareas.filter(t => !t.completada).sort((a,b) => a.fecha.localeCompare(b.fecha));
  const completadas = uni.tareas.filter(t => t.completada).sort((a,b) => b.fecha.localeCompare(a.fecha));

  let html = '';
  if(pendientes.length === 0){
    html += '<div class="empty-small">No tienes tareas pendientes 🎉</div>';
  } else {
    pendientes.forEach(t => html += tareaCardHtml(t, today));
  }
  if(completadas.length > 0){
    html += '<p class="section-label">Completadas</p>';
    completadas.forEach(t => html += tareaCardHtml(t, today));
  }
  return html;
}

function tareaCardHtml(t, today){
  const ramo = t.ramoId ? ramoById(t.ramoId) : null;
  const overdue = !t.completada && t.fecha < today;
  const [y,m,d] = t.fecha.split('-');
  const fechaDisplay = d+'/'+m;
  const prioLabel = { alta:'Alta', media:'Media', baja:'Baja' }[t.prioridad] || 'Media';
  return '<div class="tarea-card">'
    + '<button class="tarea-check'+(t.completada?' done':'')+'" data-check-tarea="'+t.id+'">'+(t.completada?'✓':'')+'</button>'
    + '<div class="tarea-info">'
    + '<p class="tarea-title'+(t.completada?' done':'')+'">'+escapeHtml(t.titulo)+'</p>'
    + '<div class="tarea-meta">'
    + (ramo ? '<span class="tarea-ramo-tag" style="background:'+ramo.color+'">'+escapeHtml(ramo.sigla||ramo.nombre)+'</span>' : '<span class="tarea-ramo-tag" style="background:var(--surface-2);color:var(--muted)">General</span>')
    + '<span class="prio-badge prio-'+t.prioridad+'">'+prioLabel+'</span>'
    + '<span class="tarea-date'+(overdue?' overdue':'')+'">'+(overdue?'⚠ ':'')+fechaDisplay+'</span>'
    + '</div></div>'
    + '<button class="del-link" data-del-tarea="'+t.id+'">Eliminar</button>'
    + '</div>';
}

function formatShortDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  if(isToday){
    return d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
  }
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short' });
}

    + '</div>';

  document.getElementById('backBtn').addEventListener('click', () => {
    notaDetailId = null;
    renderNotasView();
  });

  const cancelBtn = document.getElementById('cancelNota');
  if(cancelBtn) cancelBtn.addEventListener('click', () => {
    notaDetailId = null;
    renderNotasView();
  });

  const eliminarBtn = document.getElementById('eliminarNota');
  if(eliminarBtn) eliminarBtn.addEventListener('click', async () => {
    if(confirm('¿Eliminar esta nota?')){
      notas.items = notas.items.filter(x => x.id !== nota.id);
      notaDetailId = null;
      renderNotasView();
      await saveNotas();
    }
  });

  document.getElementById('guardarNota').addEventListener('click', async () => {
    const titulo = document.getElementById('detalleTitulo').value.trim();
    const contenido = document.getElementById('detalleContenido').value.trim();
    const categoriaId = document.getElementById('detalleCategoria').value || null;

function openCategoriasModal(){
  const root = document.getElementById('modalRoot');
  let html = '<div class="modal-overlay" id="overlay"><div class="modal">'
    + '<h2>Categorías</h2>'
    + '<div class="cat-manage-list" id="catList"></div>'
    + '<div class="cat-add-row">'
    + '<input class="name-input" id="newCatName" placeholder="Nueva categoría" maxlength="30">'
    + '<button class="add-btn" id="addCatBtn">+</button>'
    + '</div>'
    + '<div class="modal-actions">'
    + '<button class="btn btn-primary" id="closeBtn">Listo</button>'
    + '</div></div></div>';
  root.innerHTML = html;

  function renderList(){
    const list = document.getElementById('catList');
    if(notas.categorias.length === 0){
      list.innerHTML = '<p style="color:var(--muted); font-size:12.5px; text-align:center; padding:8px 0;">Sin categorías aún.</p>';
      return;
    }
    list.innerHTML = notas.categorias.map(c =>
      '<div class="cat-manage-row">'
      + '<span class="cat-dot" style="background:'+c.color+'"></span>'
      + '<span class="name">'+escapeHtml(c.nombre)+'</span>'
      + '<button class="del-link" data-del-cat="'+c.id+'">Eliminar</button>'
      + '</div>'
    ).join('');

    list.querySelectorAll('[data-del-cat]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-del-cat');
        const cat = catById(id);
        if(!cat) return;
        if(confirm('¿Eliminar "'+cat.nombre+'"? Las notas de esta categoría quedarán sin categoría.')){
          notas.categorias = notas.categorias.filter(c => c.id !== id);
          notas.items.forEach(n => { if(n.categoriaId === id) n.categoriaId = null; });
          if(notasFiltroCat === id) notasFiltroCat = 'todas';
          renderList();
          await saveNotas();
        }
      });
    });
  }
  renderList();

  document.getElementById('addCatBtn').addEventListener('click', async () => {
    const input = document.getElementById('newCatName');
    const nombre = input.value.trim();
    if(!nombre){ input.focus(); return; }
    const usedColors = notas.categorias.map(c => c.color);
    const color = NOTA_COLORS.find(c => !usedColors.includes(c)) || NOTA_COLORS[notas.categorias.length % NOTA_COLORS.length];
    const id = 'cat_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    notas.categorias.push({ id, nombre, color });
    input.value = '';
    input.focus();
    renderList();
    await saveNotas();
  });

  document.getElementById('newCatName').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') document.getElementById('addCatBtn').click();
  });

  document.getElementById('overlay').addEventListener('click', (e) => {
    if(e.target.id === 'overlay') finishCategorias();
  });
  document.getElementById('closeBtn').addEventListener('click', finishCategorias);
}

    };
    const [name, icon, desc] = map[currentTab];
    renderPlaceholder(name, icon, desc);
  }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    if(tab.classList.contains('disabled')){
      showToast('Este módulo llega pronto 👀');
      return;
    }
  });
});

function openModal(){
  selectedEmoji = EMOJIS[0];
  const root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal-overlay" id="overlay">'
    + '<div class="modal">'
    + '<h2>Nuevo hábito</h2>'
    + '<span class="field-label">Elige un ícono</span>'
    + '<div class="emoji-row" id="emojiRow"></div>'
    + '<span class="field-label">Nombre del hábito</span>'
    + '<input class="name-input" id="habitNameInput" placeholder="Ej: Tomar agua, Leer 20 min..." maxlength="40">'
    + '<div class="modal-actions">'
    + '<button class="btn btn-secondary" id="cancelBtn">Cancelar</button>'
    + '<button class="btn btn-primary" id="saveBtn">Crear</button>'
    + '</div></div></div>';

  const emojiRow = document.getElementById('emojiRow');
  EMOJIS.forEach(e => {
    const el = document.createElement('div');
    el.className = 'emoji-opt' + (e===selectedEmoji ? ' selected':'');
    el.textContent = e;
    el.addEventListener('click', () => {
      selectedEmoji = e;
      emojiRow.querySelectorAll('.emoji-opt').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
    });
    emojiRow.appendChild(el);
  });

  document.getElementById('overlay').addEventListener('click', (e) => {
    if(e.target.id === 'overlay') closeModal();
  });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', async () => {
    const input = document.getElementById('habitNameInput');
    const name = input.value.trim();
    if(!name){ input.focus(); return; }
    const id = 'h_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    state.habits.push({ id, name, emoji: selectedEmoji, createdAt: todayISO() });
    closeModal();
    renderHabitsView();
    debouncedSaveData();
  });

  setTimeout(()=>{ document.getElementById('habitNameInput').focus(); }, 50);
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

    + '<input class="name-input" id="ramoNombre" placeholder="Ej: Cálculo Integral" maxlength="60">'
    + '<span class="field-label">Sigla (opcional)</span>'
    + '<input class="name-input" id="ramoSigla" placeholder="Ej: MAT120" maxlength="12">'
    + '<span class="field-label">Profesor (opcional)</span>'
    + '<input class="name-input" id="ramoProfesor" placeholder="Nombre del profesor" maxlength="60">'
    + '<span class="field-label">Sala (opcional)</span>'

    + '<button class="btn btn-secondary" id="cancelBtn">Cancelar</button>'
    + '<button class="btn btn-primary" id="saveBtn">Crear</button>'
    + '</div></div></div>';

  const colorRow = document.getElementById('colorRow');
  RAMO_COLORS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'color-opt' + (c===selectedRamoColor ? ' selected':'');
    el.style.background = c;
    el.addEventListener('click', () => {
      selectedRamoColor = c;
      colorRow.querySelectorAll('.color-opt').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');

  });

  document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id==='overlay') closeModal(); });

    const nombre = document.getElementById('ramoNombre').value.trim();
    if(!nombre){ document.getElementById('ramoNombre').focus(); return; }
    const id = 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    uni.ramos.push({
      id, nombre,
      sigla: document.getElementById('ramoSigla').value.trim(),
      profesor: document.getElementById('ramoProfesor').value.trim(),
      sala: document.getElementById('ramoSala').value.trim(),

    });
    closeModal();
    renderUniversidadView();

  setTimeout(()=>{ document.getElementById('ramoNombre').focus(); }, 50);

function openHorarioModal(){
  const root = document.getElementById('modalRoot');
  const ramoOptions = uni.ramos.map(r => '<option value="'+r.id+'">'+escapeHtml(r.nombre)+'</option>').join('');
  const dayOptions = DAYS_ORDER.map(d => '<option value="'+d+'"'+(d===uniDay?' selected':'')+'>'+DAYS_LABEL[d]+'</option>').join('');

  root.innerHTML = '<div class="modal-overlay" id="overlay">'
    + '<div class="modal">'
    + '<h2>Nuevo bloque de horario</h2>'
    + '<span class="field-label">Ramo</span>'
    + '<select class="name-input" id="blockRamo">'+ramoOptions+'</select>'
    + '<span class="field-label">Día</span>'
    + '<select class="name-input" id="blockDia">'+dayOptions+'</select>'
    + '<span class="field-label">Hora inicio</span>'
    + '<input type="time" class="name-input" id="blockInicio" value="08:30">'
    + '<span class="field-label">Hora término</span>'
    + '<input type="time" class="name-input" id="blockFin" value="09:50">'
    + '<span class="field-label">Sala (opcional)</span>'
    + '<input class="name-input" id="blockSala" placeholder="Ej: Sala 304" maxlength="30">'
    + '<div class="modal-actions">'
    + '<button class="btn btn-secondary" id="cancelBtn">Cancelar</button>'
    + '<button class="btn btn-primary" id="saveBtn">Crear</button>'
    + '</div></div></div>';

  document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id==='overlay') closeModal(); });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', async () => {
    const ramoId = document.getElementById('blockRamo').value;
    const dia = parseInt(document.getElementById('blockDia').value, 10);
    const horaInicio = document.getElementById('blockInicio').value;
    const horaFin = document.getElementById('blockFin').value;
    if(!ramoId || !horaInicio || !horaFin) return;
    if(horaFin <= horaInicio){ showToast('La hora de término debe ser después del inicio.'); return; }
    const id = 'b_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    uni.horario.push({ id, ramoId, dia, horaInicio, horaFin, sala: document.getElementById('blockSala').value.trim() });
    uniDay = dia;
    closeModal();
    renderUniversidadView();
    debouncedSaveUni();
  });
}

function openTareaModal(){
  const root = document.getElementById('modalRoot');
  const ramoOptions = '<option value="">Sin ramo</option>' + uni.ramos.map(r => '<option value="'+r.id+'">'+escapeHtml(r.nombre)+'</option>').join('');

  root.innerHTML = '<div class="modal-overlay" id="overlay">'
    + '<div class="modal">'
    + '<h2>Nueva tarea</h2>'
    + '<span class="field-label">Título</span>'
    + '<input class="name-input" id="tareaTitulo" placeholder="Ej: Entregar informe de laboratorio" maxlength="80">'

  document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id==='overlay') closeModal(); });

    if(!titulo){ document.getElementById('tareaTitulo').focus(); return; }
    const id = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    uni.tareas.push({

    });
    closeModal();
    renderUniversidadView();

  });

  setTimeout(()=>{ document.getElementById('tareaTitulo').focus(); }, 50);
}

function handleFabClick(){
  if(currentTab === 'habitos'){
    openModal();
  } else if(currentTab === 'universidad'){
    if(uniSub === 'ramos'){
      openRamoModal();
    } else if(uniSub === 'horario'){
      if(uni.ramos.length === 0){ uniSub = 'ramos'; renderUniversidadView(); showToast('Agrega un ramo primero'); return; }
      openHorarioModal();
    } else {
      openTareaModal();
    }
  } else if(currentTab === 'notas'){
    notaDetailId = 'nueva';
    renderTab();
  }
}

document.getElementById('fabBtn').addEventListener('click', handleFabClick);

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    if(tab.classList.contains('disabled')) return;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.getAttribute('data-tab');
    renderTab();
  });
});

(async function init(){
  setDateLabel();
  if(typeof window.storage === 'undefined'){
    // Modo PWA / servido: no hay storage de Claude, usamos solo localStorage
    window.storage = {
      get: async (key) => {
        const val = localStorage.getItem(key);
        return val ? { key, value: val, shared: false } : null;
      },
      set: async (key, value) => {
        localStorage.setItem(key, value);
        return { key, value, shared: false };
      },
      delete: async (key) => {
        localStorage.removeItem(key);
        return { key, deleted: true, shared: false };
      },
      list: async () => ({ keys: Object.keys(localStorage), shared: false })
    };
  }
  document.getElementById('mainView').innerHTML = '<div class="empty"><p>Cargando…</p></div>';
  await loadData();
  await loadUni();
  await loadNotas();
  renderTab();
})();

// Registrar service worker para funcionalidad PWA
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('Service Worker registrado:', reg.scope))
      .catch(err => console.warn('Service Worker no registrado:', err));
  });
}
