function commitNoteWork(){
  if(!noteWork) return false;
  captureNoteMeta();
  const titulo = (noteWork.titulo || '').replace(/\n+/g, ' ').trim();
  let contenido = '', checklist = [];
  if(noteWork.tipo === 'lista'){
    checklist = noteWork.checklist.map(it => ({ id: it.id, text:(it.text||'').trim(), done: !!it.done })).filter(it => it.text !== '');
    contenido = checklist.map(it => (it.done ? '☑ ' : '☐ ') + it.text).join('\n');
  } else {
    contenido = (noteWork.contenido || '').trim();
  }
  let target = notas.items.find(x => x.id === notaDetailId);
  if(!target){
    if(!titulo && !contenido && checklist.length === 0) return false; // aún vacía: no se crea
    const now = new Date().toISOString();
    const id = 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    target = { id, titulo, contenido, categoriaId: noteWork.categoriaId, tipo: noteWork.tipo, checklist, creada: now, actualizada: now };
    if(noteWork.fijada) target.fijada = true;
    notas.items.push(target);
    notaDetailId = id; noteWorkId = id;
    noteDirty = true;
    debouncedSaveNotas();
    return true;
  }
  const sameContent = target.titulo === titulo
    && (target.contenido || '') === contenido
    && (target.categoriaId || null) === (noteWork.categoriaId || null)
    && (target.tipo || 'texto') === noteWork.tipo
    && (noteWork.tipo !== 'lista' || JSON.stringify((target.checklist||[]).map(i=>[i.text,!!i.done])) === JSON.stringify(checklist.map(i=>[i.text,i.done])));
  const pinChanged = !!target.fijada !== !!noteWork.fijada;
  if(sameContent && !pinChanged) return false;
  if(!sameContent){
    target.titulo = titulo;
    target.contenido = contenido;
    target.categoriaId = noteWork.categoriaId;
    target.tipo = noteWork.tipo;
    target.checklist = checklist;
    target.actualizada = new Date().toISOString();
  }
  if(pinChanged){ if(noteWork.fijada) target.fijada = true; else delete target.fijada; }

function checklistFromText(txt){

    if((m = l.match(/^[-*]\s+\[( |x|X)\]\s?(.*)$/))){ done = m[1] !== ' '; l = m[2]; }
    else if((m = l.match(/^([☐☑])\s?(.*)$/))){ done = m[1] === '☑'; l = m[2]; }
    else l = l.replace(/^[-*•]\s+/, '').replace(/^\d+[.)]\s+/, '').replace(/^#{1,3}\s+/, '');
    return { id: genNoteItemId(), text: l, done };
  }).filter(it => it.text);

// Formato (markdown) sobre el textarea
function mdWrapSelection(ta, left, right){
  const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
  const sel = v.slice(s, e);
  if(sel && v.slice(s - left.length, s) === left && v.slice(e, e + right.length) === right){
    ta.value = v.slice(0, s - left.length) + sel + v.slice(e + right.length);
    ta.setSelectionRange(s - left.length, e - left.length);
    return;
  }
  const inner = sel || '';
  ta.value = v.slice(0, s) + left + inner + right + v.slice(e);
  if(inner) ta.setSelectionRange(s + left.length, e + left.length);
  else ta.setSelectionRange(s + left.length, s + left.length);
}
const MD_ANY_PREFIX = /^(\s*)(#{1,3}\s+|[-*]\s+\[[ xX]\]\s?|[-*•]\s+|\d+[.)]\s+|>\s?)/;
function mdTogglePrefix(ta, makePrefix, detect){
  const v = ta.value;
  const s = ta.selectionStart, e = ta.selectionEnd;
  const ls = v.lastIndexOf('\n', s - 1) + 1;
  let le = v.indexOf('\n', e); if(le === -1) le = v.length;
  const block = v.slice(ls, le).split('\n');
  const allHave = block.every(l => detect.test(l));
  const out = block.map((l, i) => allHave ? l.replace(detect, '') : makePrefix(i) + l.replace(MD_ANY_PREFIX, ''));
  const joined = out.join('\n');
  ta.value = v.slice(0, ls) + joined + v.slice(le);
  const pos = ls + joined.length;
  ta.setSelectionRange(pos, pos);
}
function applyNoteFormat(kind){
  const ta = document.getElementById('detalleContenido');
  if(!ta) return;
  ta.focus();
  if(kind === 'bold') mdWrapSelection(ta, '**', '**');
  else if(kind === 'italic') mdWrapSelection(ta, '_', '_');
  else if(kind === 'strike') mdWrapSelection(ta, '~~', '~~');
  else if(kind === 'h1') mdTogglePrefix(ta, () => '# ', /^#\s+/);
  else if(kind === 'h2') mdTogglePrefix(ta, () => '## ', /^##\s+/);
  else if(kind === 'bullet') mdTogglePrefix(ta, () => '- ', /^[-*•]\s+(?!\[[ xX]\])/);
  else if(kind === 'number') mdTogglePrefix(ta, i => (i+1)+'. ', /^\d+[.)]\s+/);
  else if(kind === 'task') mdTogglePrefix(ta, () => '- [ ] ', /^[-*]\s+\[[ xX]\]\s?/);
  else if(kind === 'quote') mdTogglePrefix(ta, () => '> ', /^>\s?/);
  else if(kind === 'hr'){
    const p = ta.selectionStart, v = ta.value;
    const before = (p > 0 && v[p-1] !== '\n') ? '\n' : '';
    const ins = before + '---\n';
    ta.value = v.slice(0, p) + ins + v.slice(p);
    ta.setSelectionRange(p + ins.length, p + ins.length);
  }
  onWriterInput(ta);
}
function onWriterInput(ta){
  autoGrowTextarea(ta);
  noteWork.contenido = ta.value;
  noteChanged();
}
function listContinuation(ta, e){
  if(e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  const v = ta.value, s = ta.selectionStart;
  if(s !== ta.selectionEnd) return;
  const ls = v.lastIndexOf('\n', s - 1) + 1;
  const line = v.slice(ls, s);
  let m, next = null;
  if((m = line.match(/^(\s*)[-*]\s+\[[ xX]\]\s?(.*)$/))) next = m[2].trim() === '' ? '' : m[1] + '- [ ] ';
  else if((m = line.match(/^(\s*)([-*•])\s+(.*)$/))) next = m[3].trim() === '' ? '' : m[1] + m[2] + ' ';
  else if((m = line.match(/^(\s*)(\d+)([.)])\s+(.*)$/))) next = m[4].trim() === '' ? '' : m[1] + (parseInt(m[2],10) + 1) + m[3] + ' ';
  else if((m = line.match(/^>\s?(.*)$/))) next = m[1].trim() === '' ? '' : '> ';
  if(next === null) return;
  e.preventDefault();
  if(next === ''){
    ta.value = v.slice(0, ls) + v.slice(s);
    ta.setSelectionRange(ls, ls);
  } else {
    ta.value = v.slice(0, s) + '\n' + next + v.slice(s);
    const p = s + 1 + next.length;
    ta.setSelectionRange(p, p);
  }
  onWriterInput(ta);
}
function toggleMdTaskLine(i){
  const lines = (noteWork.contenido || '').split('\n');
  const l = lines[i];
  if(l === undefined) return;
  if(/^\s*[-*]\s+\[ \]/.test(l)) lines[i] = l.replace(/\[ \]/, '[x]');
  else if(/^\s*[-*]\s+\[[xX]\]/.test(l)) lines[i] = l.replace(/\[[xX]\]/, '[ ]');
  else if(/^\s*☐/.test(l)) lines[i] = l.replace('☐', '☑');
  else if(/^\s*☑/.test(l)) lines[i] = l.replace('☑', '☐');
  noteWork.contenido = lines.join('\n');
}

function escapeAttr(str){

function renderRecordatoriosView(){
  const main = document.getElementById('mainView');
  let html = '';
  // Banner de permisos si no están concedidos
  const nState = notifState();
  if(nState === 'default'){
    html += '<div class="notif-banner">'+ic('bell')+'<div>'
      + '<p>Para que Foco te avise a la hora del recordatorio, necesitamos permiso de notificaciones.</p>'
      + '<button class="btn btn-primary" id="askNotif">Activar notificaciones</button>'
      + '</div></div>';
  } else if(nState === 'denied'){
    html += '<div class="notif-banner">'+ic('bell')+'<div>'
      + '<p>Las notificaciones están bloqueadas. Puedes activarlas desde los permisos del sitio en tu navegador.</p>'
      + '</div></div>';
  } else if(nState === 'unsupported'){
    html += '<div class="notif-banner">'+ic('bell')+'<div>'
      + '<p>Tu navegador no soporta notificaciones. Los recordatorios funcionan como lista.</p>'
      + '</div></div>';
  }
  if(recs.items.length === 0){
    html += '<div class="empty-state">'
      + '<div class="empty-ic">'+ic('bell')+'</div>'
      + '<p class="empty-title">Nada pendiente</p>'
      + '<p class="empty-sub">Crea recordatorios con hora y repetición. Foco te avisa en el momento.</p>'
      + '</div>';
    main.innerHTML = html;
    attachRecListeners();
    return;
  }
  const now = Date.now();
  const endTodayMs = (() => { const d = new Date(); d.setHours(23,59,59,999); return d.getTime(); })();
  const enriched = recs.items.map(r => {
    const nextMs = nextOccurrenceMs(r, now - 60000); // ventana atrás de 1 min para "hace un momento"
    return { ...r, _nextMs: nextMs };
  });
  const keyMs = r => {
    const oneTimeMs = new Date(r.fecha+'T'+r.hora).getTime();
    const repeat = r.repeticion && r.repeticion !== 'ninguna';
    return repeat ? (r._nextMs !== null ? r._nextMs : oneTimeMs) : oneTimeMs;
  };
  const vencidos = [], hoy = [], proximos = [];
  enriched.filter(r => !r.completado).forEach(r => {
    const oneTimeMs = new Date(r.fecha+'T'+r.hora).getTime();
    const repeat = r.repeticion && r.repeticion !== 'ninguna';
    if(!repeat && oneTimeMs < now){ vencidos.push(r); return; }
    const ms = repeat ? (r._nextMs !== null ? r._nextMs : oneTimeMs) : oneTimeMs;
    if(ms <= endTodayMs) hoy.push(r); else proximos.push(r);
  });
  vencidos.sort((a,b) => keyMs(b) - keyMs(a));
  hoy.sort((a,b) => keyMs(a) - keyMs(b));
  proximos.sort((a,b) => keyMs(a) - keyMs(b));
  const completados = enriched.filter(r => r.completado)
    .sort((a,b) => new Date(b.fecha+'T'+b.hora).getTime() - new Date(a.fecha+'T'+a.hora).getTime());
  if(vencidos.length){
    html += '<p class="section-label">Vencidos<span class="count">'+vencidos.length+'</span></p>';
    vencidos.forEach(r => html += recCardHtml(r, now));
  }
  if(hoy.length){
    html += '<p class="section-label">Hoy<span class="count">'+hoy.length+'</span></p>';
    hoy.forEach(r => html += recCardHtml(r, now));
  }
  if(proximos.length){
    html += '<p class="section-label">Próximos<span class="count">'+proximos.length+'</span></p>';
    proximos.forEach(r => html += recCardHtml(r, now));
  }
  if(!vencidos.length && !hoy.length && !proximos.length){
    html += '<div class="empty-small">Sin recordatorios pendientes 🎉</div>';
  }
  if(completados.length){
    html += '<p class="section-label">Completados<span class="count">'+completados.length+'</span></p>';
    completados.forEach(r => html += recCardHtml(r, now, true));
  }
  main.innerHTML = html;
  attachRecListeners();
}
function recCardHtml(r, now, esPasado){
  const nextMs = r._nextMs;
  const displayMs = nextMs !== null ? nextMs : new Date(r.fecha+'T'+r.hora).getTime();
  const d = new Date(displayMs);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const fechaDisplay = formatRelDate(d);
  const oneTimeMs = new Date(r.fecha+'T'+r.hora).getTime();
  const isRepeat = r.repeticion && r.repeticion !== 'ninguna';
  const vencido = !esPasado && ((nextMs !== null && nextMs < now) || (!isRepeat && oneTimeMs < now));
  const repLabel = { ninguna:'Única', diaria:'Diaria', semanal:'Semanal', mensual:'Mensual' }[r.repeticion] || 'Única';
  return '<div class="rec-card'+(esPasado?' is-done':'')+(vencido?' overdue':'')+'">'
    + '<button class="rec-check'+(r.completado?' done':'')+'" data-toggle-rec="'+r.id+'" aria-label="'+(r.completado?'Reactivar':'Marcar hecho')+'">'+ic('check')+'</button>'
    + '<div class="rec-info" data-edit-rec="'+r.id+'">'
    + '<p class="rec-title'+(esPasado?' pasado':'')+'">'+escapeHtml(r.titulo)+'</p>'
    + '<div class="rec-meta">'
    + '<span class="rec-when">'+ic('clock')+fechaDisplay+' · '+hh+':'+mm+'</span>'
    + (isRepeat ? '<span class="rec-repeat-badge">'+ic('repeat')+repLabel+'</span>' : '')
    + (vencido ? '<span class="rec-vencido">Vencido</span>' : '')
    + '</div>'
    + '</div>'
    + '<button class="more-btn" data-more-rec="'+r.id+'" aria-label="Opciones">'+ic('more')+'</button>'
    + '</div>';
}
function formatRelDate(d){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.round((target - today) / 86400000);
  if(diffDays === 0) return 'Hoy';
  if(diffDays === 1) return 'Mañana';
  if(diffDays === -1) return 'Ayer';
  if(diffDays > 1 && diffDays < 7) return d.toLocaleDateString('es-ES', { weekday:'short' });
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short' });
}
function attachRecListeners(){

      scheduleNotificationFor(r);

  });

    btn.addEventListener('click', () => {

      const r = recs.items.find(x => x.id === id);
      if(!r) return;
      openActionSheet({
        title: r.titulo,
        actions: [
          { label:'Editar', icon:'pencil', onClick: () => openRecModal(id) },
          { label: r.completado ? 'Marcar como pendiente' : 'Marcar como hecho', icon:'check', onClick: () => {
              r.completado = !r.completado; scheduleNotificationFor(r); renderRecordatoriosView(); debouncedSaveRecs();
          } },

}
function deleteRec(id){
  const r = recs.items.find(x => x.id === id);
  if(!r) return;
  if(confirm('¿Eliminar "'+r.titulo+'"?')){
    if(notifTimers[id]){ clearTimeout(notifTimers[id]); delete notifTimers[id]; }
    recs.items = recs.items.filter(x => x.id !== id);
    renderRecordatoriosView();
    debouncedSaveRecs();
  }
}
function nowPlusMinutes(min){
  const d = new Date(Date.now() + min * 60000);
  const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const hora = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return { fecha: iso, hora };
}

  });
}

function handleFabClick(){
  if(currentTab === 'habitos'){
    openModal();
  } else if(currentTab === 'universidad'){
    if(uniSub === 'ramos'){
      if(uniRamoDetail) openEvalModal(uniRamoDetail, null);
      else openRamoModal();
    } else if(uniSub === 'horario'){
      if(uni.ramos.length === 0){ uniSub = 'ramos'; renderUniversidadView(); showToast('Agrega un ramo primero'); return; }
      openHorarioModal();
    } else if(uniSub === 'estudio'){
      if(orgView === 'horario') openActividadModal();
      else openEstudioModal();
    } else {
      openTareaModal();
    }
  } else if(currentTab === 'notas'){
    notaDetailId = 'nueva';
    renderTab();
  } else if(currentTab === 'recordatorios'){
    openRecModal();
  }
}
document.getElementById('fabBtn').addEventListener('click', handleFabClick);
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    if(tab.classList.contains('disabled')) return;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.getAttribute('data-tab');
    if(currentTab !== 'habitos') showLogros = false;
    renderTab();
    window.scrollTo(0, 0);
  });
});
// Barra compacta con el título al hacer scroll (patrón "large title" de iOS)
(function(){
  const bar = document.getElementById('compactBar');
  if(!bar) return;
  let shown = false, ticking = false;
  const update = () => {
    ticking = false;
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    const want = y > 56;
    if(want !== shown){ shown = want; bar.classList.toggle('show', shown); }
  };
  window.addEventListener('scroll', () => { if(!ticking){ ticking = true; requestAnimationFrame(update); } }, { passive:true });
})();
(async function init(){
  setDateLabel();
  if(typeof window.storage === 'undefined'){
    // Modo PWA / servido: no hay storage de Claude, usamos solo localStorage
    window.storage = {
      get: async (key) => {
        const val = localStorage.getItem(key);
        return val ? { key, value: val, shared: false } : null;
      },
      set: async (key, value) => {
        localStorage.setItem(key, value);
        return { key, value, shared: false };
      },
      delete: async (key) => {
        localStorage.removeItem(key);
        return { key, deleted: true, shared: false };
      },
      list: async () => ({ keys: Object.keys(localStorage), shared: false })
    };
  }
  document.getElementById('mainView').innerHTML = '<div class="empty"><p>Cargando…</p></div>';
  await loadData();
  await loadUni();
  await loadNotas();
  await loadRecs();
  await loadEntrenos();
  renderTab();
  // Programar notificaciones para los recordatorios ya existentes
  scheduleAllNotifications();
})();
// Registrar service worker para funcionalidad PWA
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('Service Worker registrado:', reg.scope))
      .catch(err => console.warn('Service Worker no registrado:', err));
  });
}
